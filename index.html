<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Zoom</title>

  <meta
    name="description"
    content="Connect, meet and collaborate with Zoom."
  >

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: #ffffff;
      color: #1f1f1f;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ---------------- HEADER ---------------- */

    .header {
      height: 92px;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 42px;
      background: #fff;
      position: relative;
      z-index: 10;
    }

    .logo {
      color: #2d8cff;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1.8px;
    }

    .signin {
      border: 0;
      background: transparent;
      color: #2d8cff;
      font-size: 20px;
      font-weight: 600;
      padding: 10px 0;
    }

    /* ---------------- HERO ---------------- */

    .hero {
      text-align: center;
      padding: 78px 20px 45px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(52px, 8vw, 82px);
      line-height: 0.98;
      letter-spacing: -4px;
      font-weight: 750;
    }

    .hero h1 span {
      display: block;
    }

    .hero h1 .blue {
      color: #2d8cff;
    }

    .hero p {
      max-width: 760px;
      margin: 42px auto 0;
      color: #666;
      font-size: clamp(20px, 3vw, 30px);
      line-height: 1.45;
    }

    /* ---------------- ACTIONS ---------------- */

    .actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 15px auto 80px;
      padding: 0 20px;
    }

    .action-btn {
      width: 300px;
      height: 78px;
      border-radius: 15px;
      border: none;
      font-size: 24px;
      font-weight: 600;
      transition:
        transform .15s ease,
        box-shadow .15s ease,
        background .15s ease;
    }

    .action-btn:active {
      transform: scale(.97);
    }

    .new-meeting {
      background: #2d8cff;
      color: white;
      box-shadow: 0 8px 20px rgba(45, 140, 255, .18);
    }

    .join-meeting {
      background: #edf5ff;
      color: #2d8cff;
    }

    .action-btn:hover {
      transform: translateY(-1px);
    }

    /* ---------------- VIDEO PREVIEW ---------------- */

    .preview-section {
      width: min(900px, calc(100% - 50px));
      margin: 0 auto 80px;
      padding: 42px;
      background: #f7faff;
      border-radius: 34px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .06);
    }

    .video-preview {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #17212d;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 30px;
      position: relative;
      overflow: hidden;
    }

    .video-preview::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,.04),
          transparent 55%
        );
    }

    .video-title {
      position: relative;
      z-index: 2;
      font-size: 30px;
    }

    /* ---------------- PREVIEW CONTROLS ---------------- */

    .preview-controls {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 38px;
    }

    .preview-control {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #fff;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, .04);
    }

    .preview-control span {
      font-size: 30px;
    }

    /* ---------------- JOIN MODAL ---------------- */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .join-modal {
      width: min(460px, 100%);
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .25);
      animation: modalIn .18s ease-out;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #e7e7e7;
      position: relative;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .close-modal {
      position: absolute;
      right: 18px;
      top: 15px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      background: #f0f1f4;
      font-size: 25px;
      color: #333;
    }

    .modal-body {
      padding: 30px;
    }

    .meeting-input {
      width: 100%;
      height: 60px;
      border: 2px solid #2d8cff;
      border-radius: 14px;
      padding: 0 18px;
      outline: none;
      font-size: 20px;
      color: #222;
    }

    .meeting-input::placeholder {
      color: #929292;
    }

    .meeting-input:focus {
      box-shadow: 0 0 0 4px rgba(45, 140, 255, .12);
    }

    .join-submit {
      width: 100%;
      height: 58px;
      margin-top: 18px;
      border: 0;
      border-radius: 13px;
      background: #2d8cff;
      color: white;
      font-size: 20px;
      font-weight: 600;
    }

    .join-submit:disabled {
      background: #e5e7ec;
      color: #999;
      cursor: default;
    }

    .personal-link {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: #1677d2;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
    }

    .personal-link:hover {
      text-decoration: underline;
    }

    /* ---------------- TOAST ---------------- */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(20px);
      background: #1f2937;
      color: white;
      padding: 13px 20px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 300;
      font-size: 15px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 700px) {

      .header {
        height: 82px;
        padding: 0 28px;
      }

      .logo {
        font-size: 37px;
      }

      .signin {
        font-size: 18px;
      }

      .hero {
        padding: 65px 18px 35px;
      }

      .hero h1 {
        font-size: 56px;
        letter-spacing: -3px;
      }

      .hero p {
        margin-top: 32px;
        font-size: 21px;
        line-height: 1.5;
      }

      .actions {
        flex-direction: column;
        align-items: center;
        margin-bottom: 55px;
      }

      .action-btn {
        width: min(360px, 90vw);
        height: 70px;
        font-size: 21px;
      }

      .preview-section {
        width: calc(100% - 32px);
        padding: 24px;
        border-radius: 27px;
      }

      .video-preview {
        border-radius: 20px;
        min-height: 230px;
      }

      .video-title {
        font-size: 24px;
      }

      .preview-controls {
        gap: 16px;
        margin-top: 26px;
      }

      .preview-control {
        width: 62px;
        height: 62px;
      }

      .preview-control span {
        font-size: 24px;
      }

      .modal-body {
        padding: 24px;
      }

      .join-modal {
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">Zoom</div>

    <button
      class="signin"
      type="button"
      onclick="showToast('Sign in is not connected yet.')"
    >
      Sign In
    </button>
  </header>


  <!-- HERO -->
  <main>

    <section class="hero">

      <h1>
        <span>Connect.</span>
        <span class="blue">Assist.</span>
        <span>Together.</span>
      </h1>

      <p>
        Meet, communicate and provide remote assistance
        from anywhere with a simple and secure connection.
      </p>

    </section>


    <!-- ACTION BUTTONS -->
    <section class="actions">

      <button
        class="action-btn new-meeting"
        type="button"
        onclick="newMeeting()"
      >
        New Meeting
      </button>

      <button
        class="action-btn join-meeting"
        type="button"
        onclick="openJoinModal()"
      >
        Join Meeting
      </button>

    </section>


    <!-- VIDEO PREVIEW -->
    <section class="preview-section">

      <div class="video-preview">
        <div class="video-title">
          Video Meeting
        </div>
      </div>

      <div class="preview-controls">

        <button
          class="preview-control"
          type="button"
          onclick="showToast('Microphone preview')"
          aria-label="Microphone"
        >
          <span>🎙️</span>
        </button>

        <button
          class="preview-control"
          type="button"
          onclick="showToast('Camera preview')"
          aria-label="Camera"
        >
          <span>📹</span>
        </button>

        <button
          class="preview-control"
          type="button"
          onclick="showToast('Screen sharing requires permission')"
          aria-label="Screen sharing"
        >
          <span>🖥️</span>
        </button>

        <button
          class="preview-control"
          type="button"
          onclick="showToast('Chat preview')"
          aria-label="Chat"
        >
          <span>💬</span>
        </button>

      </div>

    </section>

  </main>


  <!-- JOIN MEETING MODAL -->
  <div
    class="modal-backdrop"
    id="joinModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="joinTitle"
  >

    <div class="join-modal">

      <div class="modal-header">

        <h2 id="joinTitle">
          Join Meeting
        </h2>

        <button
          class="close-modal"
          type="button"
          onclick="closeJoinModal()"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div class="modal-body">

        <input
          id="meetingId"
          class="meeting-input"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Meeting ID"
          maxlength="20"
          aria-label="Meeting ID"
        >

        <button
          id="joinSubmit"
          class="join-submit"
          type="button"
          disabled
          onclick="joinMeeting()"
        >
          Join
        </button>

        <a
          href="#"
          class="personal-link"
          onclick="showToast('Personal Link Name is not connected yet.'); return false;"
        >
          Join with a Personal Link Name
        </a>

      </div>

    </div>

  </div>


  <!-- TOAST -->
  <div
    id="toast"
    class="toast"
    role="status"
  ></div>


  <script>

    const joinModal = document.getElementById("joinModal");
    const meetingIdInput = document.getElementById("meetingId");
    const joinSubmit = document.getElementById("joinSubmit");
    const toast = document.getElementById("toast");


    /* ---------------- JOIN MODAL ---------------- */

    function openJoinModal() {

      joinModal.classList.add("show");

      setTimeout(() => {
        meetingIdInput.focus();
      }, 100);

    }


    function closeJoinModal() {

      joinModal.classList.remove("show");

      meetingIdInput.value = "";

      joinSubmit.disabled = true;

    }


    /* ---------------- MEETING ID ---------------- */

    meetingIdInput.addEventListener("input", () => {

      // Keep numbers and spaces only.
      meetingIdInput.value =
        meetingIdInput.value.replace(/[^\d\s]/g, "");

      const cleanId =
        meetingIdInput.value.replace(/\s/g, "");

      joinSubmit.disabled =
        cleanId.length < 6;

    });


    /* ---------------- JOIN MEETING ---------------- */

    function joinMeeting() {

      const meetingId =
        meetingIdInput.value
          .replace(/\s/g, "")
          .trim();

      if (!meetingId) {
        return;
      }

      if (meetingId.length < 6) {

        showToast("Please enter a valid Meeting ID.");

        return;
      }

      /*
        Send the user to meeting.html.

        encodeURIComponent prevents special characters
        from breaking the URL.
      */

      window.location.href =
        "meeting.html?meeting=" +
        encodeURIComponent(meetingId);

    }


    /* ---------------- NEW MEETING ---------------- */

    function newMeeting() {

      // Demo meeting ID.
      const demoId =
        Math.floor(
          100000000 +
          Math.random() * 900000000
        ).toString();

      window.location.href =
        "meeting.html?meeting=" +
        demoId;

    }


    /* ---------------- ENTER KEY ---------------- */

    meetingIdInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter" && !joinSubmit.disabled) {

        joinMeeting();

      }

      if (event.key === "Escape") {

        closeJoinModal();

      }

    });


    /* ---------------- BACKDROP ---------------- */

    joinModal.addEventListener("click", (event) => {

      if (event.target === joinModal) {

        closeJoinModal();

      }

    });


    /* ---------------- TOAST ---------------- */

    let toastTimer;

    function showToast(message) {

      toast.textContent = message;

      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {

        toast.classList.remove("show");

      }, 2500);

    }

  </script>

</body>
</html>
