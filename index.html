<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#1769ff">

    <title>Zoom Workplace</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            background: #1769ff;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #1769ff;
        }

        /* SETTINGS */

        .settings {
            position: absolute;

            top: max(32px, env(safe-area-inset-top));
            left: 45px;

            width: 42px;
            height: 42px;

            padding: 0;

            border: 0;
            outline: none;

            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 20;
        }

        .settings svg {
            width: 30px;
            height: 30px;

            stroke: #ffffff;
            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .settings:active {
            transform: scale(.92);
        }

        /* BRAND */

        .brand {
            position: absolute;

            top: 25.5%;

            left: 0;
            right: 0;

            text-align: center;

            color: #ffffff;

            z-index: 2;
        }

        .brand-main {
            font-size: clamp(48px, 11vw, 66px);
            line-height: 1;
            font-weight: 500;
            letter-spacing: -3px;
        }

        .brand-sub {
            margin-top: 20px;

            font-size: clamp(42px, 10vw, 60px);
            line-height: 1;
            font-weight: 600;
            letter-spacing: -2.5px;
        }

        /* WELCOME PANEL */

        .welcome-panel {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;

            height: 50%;

            background: #000000;

            border-radius:
                38px
                38px
                0
                0;

            padding:
                34px
                48px
                max(18px, env(safe-area-inset-bottom));

            display: flex;
            flex-direction: column;
            align-items: center;

            z-index: 5;
        }

        /* WELCOME TEXT */

        .welcome-title {
            color: #ffffff;

            font-size: 29px;
            line-height: 1.1;
            font-weight: 700;
            text-align: center;
        }

        .welcome-description {
            margin-top: 17px;

            color: #ffffff;

            font-size: 20px;
            line-height: 1.2;
            font-weight: 400;

            text-align: center;
            white-space: nowrap;
        }

        /* BUTTON AREA */

        .buttons {
            width: 100%;
            max-width: 700px;

            margin-top: 27px;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        /* BUTTONS */

        .button {
            width: 100%;

            height: 54px;

            border: 0;

            border-radius: 22px;

            font-family: inherit;

            font-size: 21px;
            font-weight: 650;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                transform .12s ease,
                opacity .12s ease;
        }

        .button:active {
            transform: scale(.985);
        }

        .sign-in {
            background: #1478f2;
        }

        .dark-button {
            background: #181818;
        }

        .new-meeting {
            background: #1478f2;
        }

        /* DESKTOP */

        @media (min-width: 700px) {

            .welcome-panel {
                height: 48%;

                padding-left: 50px;
                padding-right: 50px;
            }

            .button {
                height: 58px;
            }
        }

        /* NORMAL PHONE */

        @media (min-height: 760px) and (max-height: 900px) {

            .brand {
                top: 24%;
            }

            .welcome-panel {
                height: 48%;
            }

            .welcome-title {
                font-size: 28px;
            }

            .welcome-description {
                font-size: 20px;
            }

            .buttons {
                margin-top: 25px;
                gap: 9px;
            }

            .button {
                height: 52px;
                font-size: 21px;
            }
        }

        /* SMALL PHONE */

        @media (max-height: 750px) {

            .brand {
                top: 21%;
            }

            .brand-main {
                font-size: 46px;
            }

            .brand-sub {
                font-size: 39px;
                margin-top: 13px;
            }

            .welcome-panel {
                height: 51%;
                padding-top: 23px;
            }

            .welcome-title {
                font-size: 25px;
            }

            .welcome-description {
                margin-top: 12px;
                font-size: 18px;
            }

            .buttons {
                margin-top: 19px;
                gap: 8px;
            }

            .button {
                height: 47px;
                border-radius: 20px;
                font-size: 19px;
            }
        }

        /* VERY SMALL PHONE */

        @media (max-height: 680px) {

            .brand {
                top: 17%;
            }

            .welcome-panel {
                height: 53%;
                padding-top: 18px;
            }

            .welcome-title {
                font-size: 23px;
            }

            .welcome-description {
                font-size: 17px;
                margin-top: 8px;
            }

            .buttons {
                margin-top: 15px;
                gap: 7px;
            }

            .button {
                height: 43px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SETTINGS -->

    <button
        class="settings"
        type="button"
        onclick="openSettings()"
        aria-label="Settings"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path d="M4 6h10" />
            <path d="M18 6h2" />

            <circle
                cx="16"
                cy="6"
                r="2"
            />

            <path d="M4 12h2" />
            <path d="M10 12h10" />

            <circle
                cx="8"
                cy="12"
                r="2"
            />

            <path d="M4 18h10" />
            <path d="M18 18h2" />

            <circle
                cx="16"
                cy="18"
                r="2"
            />

        </svg>

    </button>


    <!-- BRAND -->

    <div class="brand">

        <div class="brand-main">
            zoom
        </div>

        <div class="brand-sub">
            Workplace
        </div>

    </div>


    <!-- WELCOME PANEL -->

    <section class="welcome-panel">

        <h1 class="welcome-title">
            Welcome
        </h1>

        <p class="welcome-description">
            Get started with your account
        </p>


        <div class="buttons">

            <!-- SIGN IN -->

            <button
                class="button sign-in"
                type="button"
                onclick="goTo('signin')"
            >
                Sign in
            </button>


            <!-- SIGN UP -->

            <button
                class="button dark-button"
                type="button"
                onclick="goTo('signup')"
            >
                Sign up
            </button>


            <!-- NEW MEETING -->

            <button
                class="button new-meeting"
                type="button"
                onclick="createMeeting()"
            >
                New meeting
            </button>


            <!-- JOIN MEETING -->

            <button
                class="button dark-button"
                type="button"
                onclick="goTo('join')"
            >
                Join meeting
            </button>

        </div>

    </section>

</div>


<script>

    /*
     * CREATE NEW MEETING
     *
     * Generates a unique 9-digit meeting ID.
     *
     * Example:
     * 847 293 615
     */

    function createMeeting() {

        const part1 =
            Math.floor(100 + Math.random() * 900);

        const part2 =
            Math.floor(100 + Math.random() * 900);

        const part3 =
            Math.floor(100 + Math.random() * 900);

        const meetingId =
            `${part1}${part2}${part3}`;


        /*
         * Save the meeting ID temporarily.
         * The meeting page can read this value.
         */

        sessionStorage.setItem(
            "meetingId",
            meetingId
        );


        /*
         * Open the meeting page.
         */

        window.location.href =
            "meeting.html?id=" + meetingId;

    }


    function goTo(page) {

        if (page === "signin") {

            window.location.href =
                "signin.html";

        }

        if (page === "signup") {

            window.location.href =
                "signup.html";

        }

        if (page === "join") {

            window.location.href =
                "join.html";

        }

    }


    function openSettings() {

        window.location.href =
            "settings.html";

    }

</script>

</body>
</html>
