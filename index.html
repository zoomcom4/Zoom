<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#1769ff">

    <title>Zoom Workplace</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            background: #1769ff;
        }

        /* =================================
           MAIN APP
        ================================= */

        .app {
            position: relative;

            width: 100%;
            height: 100dvh;

            overflow: hidden;

            background: #1769ff;
        }

        /* =================================
           SETTINGS
        ================================= */

        .settings {
            position: absolute;

            top: max(32px, env(safe-area-inset-top));
            left: 45px;

            width: 42px;
            height: 42px;

            padding: 0;

            border: 0;
            outline: none;

            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 20;
        }

        .settings svg {
            width: 30px;
            height: 30px;

            stroke: #ffffff;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .settings:active {
            transform: scale(.92);
        }

        /* =================================
           BRAND
        ================================= */

        .brand {
            position: absolute;

            top: 25.5%;

            left: 0;
            right: 0;

            text-align: center;

            color: #ffffff;

            z-index: 2;
        }

        .brand-main {
            font-size: clamp(48px, 11vw, 66px);

            line-height: 1;

            font-weight: 500;

            letter-spacing: -3px;
        }

        .brand-sub {
            margin-top: 20px;

            font-size: clamp(42px, 10vw, 60px);

            line-height: 1;

            font-weight: 600;

            letter-spacing: -2.5px;
        }

        /* =================================
           WELCOME PANEL
        ================================= */

        .welcome-panel {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;

            height: 50%;

            background: #000000;

            border-radius:
                38px
                38px
                0
                0;

            padding:
                34px
                48px
                max(18px, env(safe-area-inset-bottom));

            display: flex;
            flex-direction: column;
            align-items: center;

            z-index: 5;
        }

        /* =================================
           WELCOME TEXT
        ================================= */

        .welcome-title {
            color: #ffffff;

            font-size: 29px;

            line-height: 1.1;

            font-weight: 700;

            text-align: center;
        }

        .welcome-description {
            margin-top: 17px;

            color: #ffffff;

            font-size: 20px;

            line-height: 1.2;

            font-weight: 400;

            text-align: center;

            white-space: nowrap;
        }

        /* =================================
           BUTTON AREA
        ================================= */

        .buttons {
            width: 100%;

            max-width: 700px;

            margin-top: 27px;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        /* =================================
           BUTTONS
        ================================= */

        .button {
            width: 100%;

            height: 54px;

            border: 0;

            border-radius: 22px;

            font-family: inherit;

            font-size: 21px;

            font-weight: 650;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                transform .12s ease,
                opacity .12s ease;
        }

        .button:active {
            transform: scale(.985);
        }

        .sign-in {
            background: #1478f2;
        }

        .dark-button {
            background: #181818;
        }

        .new-meeting {
            background: #1478f2;
        }

        /* =================================
           MEETING MODAL OVERLAY
        ================================= */

        .meeting-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, .62);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 24px;

            z-index: 100;
        }

        .meeting-overlay.show {
            display: flex;
        }

        /* =================================
           MEETING MODAL
        ================================= */

        .meeting-modal {
            width: 100%;

            max-width: 430px;

            background: #ffffff;

            border-radius: 28px;

            padding: 30px 24px 24px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .35);

            animation:
                modalIn .22s ease-out;
        }

        @keyframes modalIn {

            from {
                opacity: 0;
                transform: translateY(18px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* =================================
           MODAL HEADER
        ================================= */

        .modal-top {
            display: flex;

            align-items: flex-start;
            justify-content: space-between;
        }

        .modal-heading {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .success-icon {
            width: 46px;
            height: 46px;

            border-radius: 50%;

            background: #e9f3ff;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg {
            width: 25px;
            height: 25px;

            stroke: #1478f2;

            stroke-width: 2.4;

            fill: none;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .modal-title {
            color: #111111;

            font-size: 22px;

            line-height: 1.15;

            font-weight: 700;
        }

        .modal-subtitle {
            margin-top: 5px;

            color: #666666;

            font-size: 14px;

            line-height: 1.3;
        }

        /* =================================
           CLOSE BUTTON
        ================================= */

        .close-modal {
            width: 36px;
            height: 36px;

            border: 0;

            border-radius: 50%;

            background: #f2f2f2;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .close-modal svg {
            width: 18px;
            height: 18px;

            stroke: #555555;

            stroke-width: 2;

            fill: none;
        }

        /* =================================
           MEETING ID CARD
        ================================= */

        .meeting-id-card {
            margin-top: 28px;

            padding: 19px;

            border-radius: 18px;

            background: #f5f7fa;

            border: 1px solid #e5e8ed;

            text-align: center;
        }

        .meeting-id-label {
            color: #777777;

            font-size: 13px;

            font-weight: 500;

            letter-spacing: .2px;
        }

        .meeting-id {
            margin-top: 8px;

            color: #111111;

            font-size: 29px;

            font-weight: 700;

            letter-spacing: 2px;
        }

        /* =================================
           INVITATION
        ================================= */

        .invitation {
            margin-top: 17px;

            color: #666666;

            font-size: 14px;

            line-height: 1.45;

            text-align: center;
        }

        /* =================================
           MODAL ACTIONS
        ================================= */

        .modal-actions {
            margin-top: 23px;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .modal-button {
            width: 100%;

            min-height: 52px;

            border: 0;

            border-radius: 16px;

            font-family: inherit;

            font-size: 16px;

            font-weight: 650;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;
        }

        .modal-button svg {
            width: 19px;
            height: 19px;

            fill: none;

            stroke-width: 2;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .start-button {
            background: #1478f2;

            color: #ffffff;
        }

        .start-button svg {
            stroke: #ffffff;
        }

        .copy-button {
            background: #eef4ff;

            color: #1769ff;
        }

        .copy-button svg {
            stroke: #1769ff;
        }

        .share-button {
            background: #f3f3f3;

            color: #222222;
        }

        .share-button svg {
            stroke: #222222;
        }

        .modal-button:active {
            transform: scale(.985);
        }

        /* =================================
           COPIED MESSAGE
        ================================= */

        .copy-status {
            min-height: 18px;

            margin-top: 8px;

            color: #16833b;

            font-size: 13px;

            font-weight: 600;

            text-align: center;

            opacity: 0;

            transition: opacity .2s ease;
        }

        .copy-status.visible {
            opacity: 1;
        }

        /* =================================
           NORMAL PHONE
        ================================= */

        @media (min-height: 760px) and (max-height: 900px) {

            .brand {
                top: 24%;
            }

            .welcome-panel {
                height: 48%;
            }

            .welcome-title {
                font-size: 28px;
            }

            .welcome-description {
                font-size: 20px;
            }

            .buttons {
                margin-top: 25px;
                gap: 9px;
            }

            .button {
                height: 52px;
                font-size: 21px;
            }
        }

        /* =================================
           SMALL PHONE
        ================================= */

        @media (max-height: 750px) {

            .brand {
                top: 21%;
            }

            .brand-main {
                font-size: 46px;
            }

            .brand-sub {
                font-size: 39px;
                margin-top: 13px;
            }

            .welcome-panel {
                height: 51%;
                padding-top: 23px;
            }

            .welcome-title {
                font-size: 25px;
            }

            .welcome-description {
                margin-top: 12px;
                font-size: 18px;
            }

            .buttons {
                margin-top: 19px;
                gap: 8px;
            }

            .button {
                height: 47px;
                border-radius: 20px;
                font-size: 19px;
            }

            .meeting-modal {
                padding: 25px 20px 20px;
            }

            .meeting-id {
                font-size: 26px;
            }
        }

        /* =================================
           VERY SMALL PHONE
        ================================= */

        @media (max-height: 680px) {

            .brand {
                top: 17%;
            }

            .welcome-panel {
                height: 53%;
                padding-top: 18px;
            }

            .welcome-title {
                font-size: 23px;
            }

            .welcome-description {
                font-size: 17px;
                margin-top: 8px;
            }

            .buttons {
                margin-top: 15px;
                gap: 7px;
            }

            .button {
                height: 43px;
                font-size: 18px;
            }

            .meeting-overlay {
                padding: 12px;
            }

            .meeting-modal {
                border-radius: 23px;
                padding: 21px 17px 17px;
            }

            .meeting-id-card {
                margin-top: 20px;
                padding: 14px;
            }

            .modal-actions {
                margin-top: 16px;
                gap: 7px;
            }

            .modal-button {
                min-height: 45px;
            }
        }

        /* =================================
           DESKTOP
        ================================= */

        @media (min-width: 700px) {

            .welcome-panel {
                height: 48%;

                padding-left: 50px;
                padding-right: 50px;
            }

            .button {
                height: 58px;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <!-- =================================
         SETTINGS
    ================================= -->

    <button
        class="settings"
        type="button"
        onclick="openSettings()"
        aria-label="Settings"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path d="M4 6h10" />
            <path d="M18 6h2" />

            <circle
                cx="16"
                cy="6"
                r="2"
            />

            <path d="M4 12h2" />
            <path d="M10 12h10" />

            <circle
                cx="8"
                cy="12"
                r="2"
            />

            <path d="M4 18h10" />
            <path d="M18 18h2" />

            <circle
                cx="16"
                cy="18"
                r="2"
            />

        </svg>

    </button>


    <!-- =================================
         BRAND
    ================================= -->

    <div class="brand">

        <div class="brand-main">
            zoom
        </div>

        <div class="brand-sub">
            Workplace
        </div>

    </div>


    <!-- =================================
         WELCOME PANEL
    ================================= -->

    <section class="welcome-panel">

        <h1 class="welcome-title">
            Welcome
        </h1>

        <p class="welcome-description">
            Get started with your account
        </p>

        <div class="buttons">

            <button
                class="button sign-in"
                type="button"
                onclick="goTo('signin')"
            >
                Sign in
            </button>

            <button
                class="button dark-button"
                type="button"
                onclick="goTo('signup')"
            >
                Sign up
            </button>

            <button
                class="button new-meeting"
                type="button"
                onclick="createMeeting()"
            >
                New meeting
            </button>

            <button
                class="button dark-button"
                type="button"
                onclick="goTo('join')"
            >
                Join meeting
            </button>

        </div>

    </section>

</div>


<!-- =================================
     NEW MEETING MODAL
================================= -->

<div
    class="meeting-overlay"
    id="meetingOverlay"
>

    <div
        class="meeting-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="meetingTitle"
    >

        <!-- HEADER -->

        <div class="modal-top">

            <div class="modal-heading">

                <div class="success-icon">

                    <svg
                        viewBox="0 0 24 24"
                    >
                        <path d="M5 12.5l4 4L19 7" />
                    </svg>

                </div>

                <div>

                    <h2
                        class="modal-title"
                        id="meetingTitle"
                    >
                        Your meeting is ready
                    </h2>

                    <p class="modal-subtitle">
                        Your meeting has been created.
                    </p>

                </div>

            </div>


            <button
                class="close-modal"
                type="button"
                onclick="closeMeetingModal()"
                aria-label="Close"
            >

                <svg
                    viewBox="0 0 24 24"
                >
                    <path d="M6 6l12 12" />
                    <path d="M18 6L6 18" />
                </svg>

            </button>

        </div>


        <!-- MEETING ID -->

        <div class="meeting-id-card">

            <div class="meeting-id-label">
                Meeting ID
            </div>

            <div
                class="meeting-id"
                id="meetingIdDisplay"
            >
                000 000 000
            </div>

        </div>


        <p class="invitation">
            Share this meeting ID with the people you want
            to invite to your meeting.
        </p>


        <!-- ACTIONS -->

        <div class="modal-actions">

            <!-- START -->

            <button
                class="modal-button start-button"
                type="button"
                onclick="startMeeting()"
            >

                <svg
                    viewBox="0 0 24 24"
                >
                    <path d="M8 5l11 7-11 7V5z" />
                </svg>

                Start meeting

            </button>


            <!-- COPY -->

            <button
                class="modal-button copy-button"
                type="button"
                onclick="copyMeetingId()"
            >

                <svg
                    viewBox="0 0 24 24"
                >
                    <rect
                        x="9"
                        y="9"
                        width="10"
                        height="10"
                        rx="2"
                    />

                    <path
                        d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"
                    />
                </svg>

                Copy meeting ID

            </button>


            <!-- SHARE -->

            <button
                class="modal-button share-button"
                type="button"
                onclick="shareInvitation()"
            >

                <svg
                    viewBox="0 0 24 24"
                >
                    <circle
                        cx="18"
                        cy="5"
                        r="2"
                    />

                    <circle
                        cx="6"
                        cy="12"
                        r="2"
                    />

                    <circle
                        cx="18"
                        cy="19"
                        r="2"
                    />

                    <path d="M8 11l8-5" />
                    <path d="M8 13l8 5" />
                </svg>

                Share invitation

            </button>

        </div>


        <div
            class="copy-status"
            id="copyStatus"
        >
            Meeting ID copied
        </div>

    </div>

</div>

<script type="module">

/* =================================
   FIREBASE
================================= */

import {
    db,
    auth
} from "./firebase-config.js";

import {
    signInAnonymously
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =================================
   PAGE NAVIGATION
================================= */

window.goTo = function(page) {

    if (page === "signin") {

        window.location.href =
            "signin.html";

    }

    if (page === "signup") {

        window.location.href =
            "signup.html";

    }

    if (page === "join") {

        window.location.href =
            "join.html";

    }

};


/* =================================
   SETTINGS
================================= */

window.openSettings = function() {

    window.location.href =
        "settings.html";

};


/* =================================
   FORMAT MEETING ID
================================= */

function formatMeetingId(id) {

    return id.substring(0, 3)
        + " "
        + id.substring(3, 6)
        + " "
        + id.substring(6, 9);

}


/* =================================
   CREATE MEETING
================================= */

window.createMeeting = async function() {

    const overlay =
        document.getElementById(
            "meetingOverlay"
        );

    const display =
        document.getElementById(
            "meetingIdDisplay"
        );

    const status =
        document.getElementById(
            "copyStatus"
        );


    /*
     * Generate a 9-digit Meeting ID.
     */

    const part1 =
        Math.floor(
            100 + Math.random() * 900
        );

    const part2 =
        Math.floor(
            100 + Math.random() * 900
        );

    const part3 =
        Math.floor(
            100 + Math.random() * 900
        );


    const meetingId =
        `${part1}${part2}${part3}`;


    /*
     * Show the ID immediately.
     */

    display.textContent =
        formatMeetingId(
            meetingId
        );


    status.classList.remove(
        "visible"
    );


    /*
     * Show the modal.
     */

    overlay.classList.add(
        "show"
    );


    try {

        /*
         * Authenticate the host anonymously.
         *
         * This means a host can create a meeting
         * without creating a normal account.
         */

        if (!auth.currentUser) {

            await signInAnonymously(
                auth
            );

        }


        /*
         * Create the Firestore meeting document.
         *
         * meetings
         *    └── 123456789
         */

        const meetingRef =
            doc(
                db,
                "meetings",
                meetingId
            );


        await setDoc(
            meetingRef,
            {

                meetingId:
                    meetingId,

                hostId:
                    auth.currentUser.uid,

                status:
                    "active",

                createdAt:
                    serverTimestamp(),

                participants: {}

            }
        );


        /*
         * Save locally too.
         */

        sessionStorage.setItem(
            "meetingId",
            meetingId
        );


        sessionStorage.setItem(
            "currentMeetingId",
            meetingId
        );


        sessionStorage.setItem(
            "joiningAsHost",
            "true"
        );


    } catch (error) {

    console.error(
        "Create meeting error:",
        error
    );

    overlay.classList.remove(
        "show"
    );

    alert(
        "Firebase error:\n\n"
        + (error.code || "unknown-error")
        + "\n\n"
        + (error.message || "Unknown Firebase error")
    );

}
};


/* =================================
   CLOSE MODAL
================================= */

window.closeMeetingModal =
    function() {

        document
            .getElementById(
                "meetingOverlay"
            )
            .classList.remove(
                "show"
            );

    };


/* =================================
   COPY MEETING ID
================================= */

window.copyMeetingId =
    async function() {

        const meetingId =
            sessionStorage.getItem(
                "meetingId"
            );


        if (!meetingId) {
            return;
        }


        const formattedId =
            formatMeetingId(
                meetingId
            );


        try {

            await navigator.clipboard.writeText(
                formattedId
            );

        } catch (error) {

            const input =
                document.createElement(
                    "textarea"
                );

            input.value =
                formattedId;

            document.body.appendChild(
                input
            );

            input.select();

            document.execCommand(
                "copy"
            );

            input.remove();

        }


        const status =
            document.getElementById(
                "copyStatus"
            );


        status.textContent =
            "Meeting ID copied";


        status.classList.add(
            "visible"
        );


        setTimeout(
            () => {

                status.classList.remove(
                    "visible"
                );

            },
            2200
        );

    };


/* =================================
   SHARE INVITATION
================================= */

window.shareInvitation =
    async function() {

        const meetingId =
            sessionStorage.getItem(
                "meetingId"
            );


        if (!meetingId) {
            return;
        }


        const formattedId =
            formatMeetingId(
                meetingId
            );


        /*
         * The invitation link now points
         * directly to join.html with the ID.
         */

        const joinUrl =
            window.location.origin
            + window.location.pathname
                .replace(
                    "index.html",
                    "join.html"
                )
            + "?meeting="
            + encodeURIComponent(
                meetingId
            );


        const invitation =
            "Join my Zoom meeting.\n\n"
            + "Meeting ID: "
            + formattedId
            + "\n\n"
            + joinUrl;


        if (navigator.share) {

            try {

                await navigator.share({

                    title:
                        "Zoom meeting invitation",

                    text:
                        invitation

                });

            } catch (error) {

                /*
                 * Sharing was cancelled.
                 */

            }

        } else {

            try {

                await navigator.clipboard.writeText(
                    invitation
                );


                const status =
                    document.getElementById(
                        "copyStatus"
                    );


                status.textContent =
                    "Invitation copied";


                status.classList.add(
                    "visible"
                );


                setTimeout(
                    () => {

                        status.classList.remove(
                            "visible"
                        );

                        status.textContent =
                            "Meeting ID copied";

                    },
                    2200
                );

            } catch (error) {

                alert(
                    invitation
                );

            }

        }

    };


/* =================================
   START MEETING
================================= */

window.startMeeting =
    function() {

        const meetingId =
            sessionStorage.getItem(
                "meetingId"
            );


        if (!meetingId) {

            createMeeting();

            return;

        }


        /*
         * Host enters the meeting using
         * the same ID that was stored
         * in Firestore.
         */

        window.location.href =
            "meeting.html?id="
            + encodeURIComponent(
                meetingId
            );

    };


/* =================================
   CLOSE WHEN CLICKING OUTSIDE
================================= */

document
    .getElementById(
        "meetingOverlay"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeMeetingModal();

            }

        }
    );


/* =================================
   ESCAPE KEY
================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeMeetingModal();

        }

    }
);

</script>

</body>
</html>
