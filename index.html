<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#1769ff">

    <title>Zoom Workplace</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            background: #1769ff;
        }

        /* =========================
           MAIN APP
        ========================= */

        .app {
            position: relative;

            width: 100%;
            height: 100dvh;

            min-height: 600px;

            overflow: hidden;

            background: #1769ff;
        }

        /* =========================
           SETTINGS
        ========================= */

        .settings {
            position: absolute;

            top: max(30px, env(safe-area-inset-top));
            left: 48px;

            width: 42px;
            height: 42px;

            border: 0;
            background: transparent;

            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings svg {
            width: 32px;
            height: 32px;
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            position: absolute;

            top: 25.5%;

            left: 0;
            right: 0;

            text-align: center;

            color: white;

            z-index: 2;
        }

        .brand-main {
            font-size: clamp(48px, 11vw, 66px);

            line-height: 1;

            font-weight: 500;

            letter-spacing: -3px;
        }

        .brand-sub {
            margin-top: 20px;

            font-size: clamp(42px, 10vw, 60px);

            line-height: 1;

            font-weight: 600;

            letter-spacing: -2.5px;
        }

        /* =========================
           WELCOME PANEL
        ========================= */

        .welcome-panel {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;

            /*
             * This is the important part.
             * The reference screenshot uses
             * roughly 42% of the screen.
             */
            height: 42%;

            min-height: 650px;

            background: #000;

            border-radius:
                38px
                38px
                0
                0;

            padding:
                70px
                48px
                max(25px, env(safe-area-inset-bottom));

            display: flex;
            flex-direction: column;
            align-items: center;

            z-index: 5;
        }

        /* =========================
           WELCOME TEXT
        ========================= */

        .welcome-title {
            color: #fff;

            font-size: 31px;

            line-height: 1.1;

            font-weight: 700;

            text-align: center;
        }

        .welcome-description {
            margin-top: 24px;

            color: #fff;

            font-size: 23px;

            line-height: 1.2;

            font-weight: 400;

            text-align: center;

            white-space: nowrap;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            width: 100%;

            max-width: 735px;

            margin-top: 48px;

            display: flex;
            flex-direction: column;

            gap: 16px;
        }

        .button {
            width: 100%;

            height: 72px;

            border: 0;

            border-radius: 25px;

            font-family: inherit;

            font-size: 25px;

            font-weight: 650;

            color: #fff;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform .12s ease,
                opacity .12s ease;
        }

        .button:active {
            transform: scale(.985);
        }

        .sign-in {
            background: #1478f2;
        }

        .dark-button {
            background: #181818;
        }

        /* =========================
           SMALL HEIGHT PHONES
        ========================= */

        @media (max-height: 750px) {

            .brand {
                top: 23%;
            }

            .brand-main {
                font-size: 48px;
            }

            .brand-sub {
                font-size: 41px;
                margin-top: 14px;
            }

            .welcome-panel {
                height: 43%;
                min-height: 0;

                padding-top: 42px;
            }

            .welcome-title {
                font-size: 27px;
            }

            .welcome-description {
                margin-top: 15px;
                font-size: 20px;
            }

            .buttons {
                margin-top: 30px;
                gap: 13px;
            }

            .button {
                height: 61px;
                border-radius: 22px;
                font-size: 22px;
            }
        }

        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-height: 680px) {

            .brand {
                top: 20%;
            }

            .welcome-panel {
                padding-top: 30px;
            }

            .welcome-title {
                font-size: 25px;
            }

            .welcome-description {
                font-size: 18px;
            }

            .buttons {
                margin-top: 23px;
            }

            .button {
                height: 55px;
                font-size: 20px;
            }
        }

        /* =========================
           DESKTOP / WINDOWS
        ========================= */

        @media (min-width: 700px) {

            .welcome-panel {
                height: 42%;

                padding-left: 48px;
                padding-right: 48px;
            }

            .button {
                height: 70px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SETTINGS -->
    <button
        class="settings"
        onclick="openSettings()"
        aria-label="Settings"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                d="M12 15.5
                   A3.5 3.5 0 1 0 12 8.5
                   A3.5 3.5 0 0 0 12 15.5Z"
                stroke="white"
                stroke-width="1.7"
            />

            <path
                d="
                M19.4 15
                L21 16
                L19 19.5
                L17.3 18.5

                C16.5 19.1 15.6 19.5 14.6 19.8
                L14.4 21.8
                H10.4
                L10.2 19.8

                C9.2 19.5 8.3 19.1 7.5 18.5
                L5.8 19.5
                L3.8 16
                L5.4 15

                C5.2 14 5.2 13 5.4 12

                C5.2 11 5.2 10 5.4 9
                L3.8 8
                L5.8 4.5
                L7.5 5.5

                C8.3 4.9 9.2 4.5 10.2 4.2
                L10.4 2.2
                H14.4
                L14.6 4.2

                C15.6 4.5 16.5 4.9 17.3 5.5
                L19 4.5
                L21 8
                L19.4 9

                C19.6 10 19.6 11 19.4 12
                C19.6 13 19.6 14 19.4 15Z
                "
                stroke="white"
                stroke-width="1.7"
                stroke-linejoin="round"
            />

        </svg>

    </button>


    <!-- BRAND -->
    <div class="brand">

        <div class="brand-main">
            zoom
        </div>

        <div class="brand-sub">
            Workplace
        </div>

    </div>


    <!-- WELCOME -->
    <section class="welcome-panel">

        <h1 class="welcome-title">
            Welcome
        </h1>

        <p class="welcome-description">
            Get started with your account
        </p>


        <div class="buttons">

            <button
                class="button sign-in"
                onclick="goTo('signin')"
            >
                Sign in
            </button>

            <button
                class="button dark-button"
                onclick="goTo('signup')"
            >
                Sign up
            </button>

            <button
                class="button dark-button"
                onclick="goTo('join')"
            >
                Join meeting
            </button>

        </div>

    </section>

</div>


<script>

    function goTo(page) {

        if (page === "signin") {
            window.location.href = "signin.html";
        }

        if (page === "signup") {
            window.location.href = "signup.html";
        }

        if (page === "join") {
            window.location.href = "join.html";
        }

    }


    function openSettings() {

        window.location.href = "settings.html";

    }

</script>

</body>
</html>
