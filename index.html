<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#1769ff">

    <title>Your Product</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            background: #1769ff;
            color: #ffffff;
        }

        /* =========================
           MAIN SCREEN
        ========================= */

        .app {
            position: relative;
            width: 100%;
            height: 100dvh;
            min-height: 650px;
            background: #1769ff;
            overflow: hidden;
        }

        /* =========================
           TOP BAR
        ========================= */

        .top-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 150px;

            padding:
                max(28px, env(safe-area-inset-top))
                28px
                0
                28px;

            z-index: 10;
        }

        .settings-button {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;
            border: 0;
            color: white;

            cursor: pointer;
        }

        .settings-icon {
            width: 31px;
            height: 31px;
        }

        /* =========================
           BRAND
        ========================= */

        .brand-area {
            position: absolute;

            left: 20px;
            right: 20px;

            top: 50%;

            transform: translateY(-54%);

            text-align: center;

            z-index: 2;
        }

        .brand-name {
            font-size: clamp(50px, 13vw, 76px);
            line-height: 0.95;

            font-weight: 500;
            letter-spacing: -4px;

            color: #ffffff;
        }

        .brand-subtitle {
            margin-top: 22px;

            font-size: clamp(42px, 10.5vw, 62px);
            line-height: 0.95;

            font-weight: 600;
            letter-spacing: -2.8px;

            color: #ffffff;
        }

        /* =========================
           BOTTOM WELCOME PANEL
        ========================= */

        .welcome-panel {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;

            min-height: 54%;

            background: #000000;

            border-radius:
                38px
                38px
                0
                0;

            padding:
                80px
                48px
                max(34px, env(safe-area-inset-bottom));

            display: flex;
            flex-direction: column;
            align-items: center;

            z-index: 5;
        }

        /* =========================
           WELCOME TEXT
        ========================= */

        .welcome-title {
            color: #ffffff;

            font-size: 36px;
            line-height: 1.1;

            font-weight: 700;

            text-align: center;
        }

        .welcome-description {
            margin-top: 25px;

            color: #ffffff;

            font-size: 25px;
            line-height: 1.25;

            font-weight: 400;

            text-align: center;
        }

        /* =========================
           BUTTON CONTAINER
        ========================= */

        .buttons {
            width: 100%;
            max-width: 735px;

            margin-top: 48px;

            display: flex;
            flex-direction: column;

            gap: 24px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .action-button {
            width: 100%;
            height: 96px;

            border-radius: 29px;

            border: none;
            outline: none;

            font-family: inherit;

            font-size: 30px;
            font-weight: 650;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform 0.12s ease,
                opacity 0.12s ease;
        }

        .action-button:active {
            transform: scale(0.985);
        }

        .sign-in {
            background: #1478f2;
            color: #ffffff;
        }

        .secondary {
            background: #181818;
            color: #ffffff;
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 800px) {

            .app {
                min-height: 700px;
            }

            .top-area {
                padding-left: 40px;
                padding-right: 40px;
            }

            .brand-area {
                top: 44%;
            }

            .welcome-panel {
                left: 50%;
                right: auto;

                transform: translateX(-50%);

                width: min(760px, 92%);

                min-height: auto;

                bottom: 20px;

                border-radius: 38px;

                padding: 55px 55px 50px;
            }

            .buttons {
                margin-top: 42px;
            }

            .action-button {
                height: 82px;
            }
        }

        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-height: 720px) {

            .brand-area {
                top: 40%;
            }

            .brand-name {
                font-size: 52px;
            }

            .brand-subtitle {
                font-size: 42px;
                margin-top: 15px;
            }

            .welcome-panel {
                padding-top: 48px;
            }

            .welcome-title {
                font-size: 29px;
            }

            .welcome-description {
                margin-top: 16px;
                font-size: 21px;
            }

            .buttons {
                margin-top: 30px;
                gap: 16px;
            }

            .action-button {
                height: 72px;
                font-size: 24px;
                border-radius: 24px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- TOP SETTINGS -->
    <div class="top-area">

        <button
            class="settings-button"
            type="button"
            aria-label="Settings"
            onclick="openSettings()"
        >

            <!-- Gear icon -->
            <svg
                class="settings-icon"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M12 15.5
                       A3.5 3.5 0 1 0 12 8.5
                       A3.5 3.5 0 0 0 12 15.5Z"
                    stroke="white"
                    stroke-width="1.7"
                />

                <path
                    d="
                    M19.4 15
                    L21 16
                    L19 19.5
                    L17.3 18.5

                    C16.5 19.1 15.6 19.5 14.6 19.8
                    L14.4 21.8
                    H10.4
                    L10.2 19.8

                    C9.2 19.5 8.3 19.1 7.5 18.5
                    L5.8 19.5
                    L3.8 16
                    L5.4 15

                    C5.2 14 5.2 13 5.4 12

                    C5.2 11 5.2 10 5.4 9
                    L3.8 8
                    L5.8 4.5
                    L7.5 5.5

                    C8.3 4.9 9.2 4.5 10.2 4.2
                    L10.4 2.2
                    H14.4
                    L14.6 4.2

                    C15.6 4.5 16.5 4.9 17.3 5.5
                    L19 4.5
                    L21 8
                    L19.4 9

                    C19.6 10 19.6 11 19.4 12
                    C19.6 13 19.6 14 19.4 15Z
                    "
                    stroke="white"
                    stroke-width="1.7"
                    stroke-linejoin="round"
                />
            </svg>

        </button>

    </div>


    <!-- BRAND -->
    <div class="brand-area">

        <!-- Change this to your product name -->
        <div class="brand-name">
            zoom
        </div>

        <div class="brand-subtitle">
            Workplace
        </div>

    </div>


    <!-- WELCOME PANEL -->
    <section class="welcome-panel">

        <h1 class="welcome-title">
            Welcome
        </h1>

        <p class="welcome-description">
            Get started with your account
        </p>


        <div class="buttons">

            <button
                class="action-button sign-in"
                type="button"
                onclick="goTo('signin')"
            >
                Sign in
            </button>


            <button
                class="action-button secondary"
                type="button"
                onclick="goTo('signup')"
            >
                Sign up
            </button>


            <button
                class="action-button secondary"
                type="button"
                onclick="goTo('join')"
            >
                Join meeting
            </button>

        </div>

    </section>

</div>


<script>

    function goTo(page) {

        if (page === "signin") {
            window.location.href = "signin.html";
        }

        if (page === "signup") {
            window.location.href = "signup.html";
        }

        if (page === "join") {
            window.location.href = "join.html";
        }

    }


    function openSettings() {

        /*
         * Change this to your settings page
         * when you are ready.
         */

        window.location.href = "settings.html";

    }

</script>

</body>
</html>
