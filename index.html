
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zoom</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            background: #ffffff;
            color: #222;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #2d8cff;
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 15px;
        }

        .signin {
            color: #2d8cff;
            font-weight: 600;
        }

        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 7%;
            gap: 50px;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero h1 {
            font-size: clamp(42px, 6vw, 70px);
            line-height: 1.05;
            margin-bottom: 25px;
        }

        .hero h1 span {
            color: #2d8cff;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            cursor: pointer;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
        }

        .primary {
            background: #2d8cff;
            color: white;
        }

        .secondary {
            background: #eef6ff;
            color: #2d8cff;
        }

        .hero-card {
            width: 420px;
            max-width: 100%;
            background: #f7faff;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .screen {
            height: 240px;
            border-radius: 15px;
            background: #17202b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .control {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        @media (max-width: 800px) {

            header {
                padding: 0 20px;
            }

            nav a:not(.signin) {
                display: none;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                padding: 45px 20px;
            }

            .buttons {
                justify-content: center;
            }

            .hero-card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">Zoom</div>

    <nav>
        <a href="#">Products</a>
        <a href="#">Solutions</a>
        <a href="#">Resources</a>
        <a href="#" class="signin">Sign In</a>
    </nav>

</header>

<section class="hero">

    <div class="hero-text">

        <h1>
            Connect.<br>
            <span>Assist.</span><br>
            Together.
        </h1>

        <p>
            Meet, communicate and provide remote assistance
            from anywhere with a simple and secure connection.
        </p>

        <div class="buttons">

            <button
                class="primary"
                onclick="createMeeting()"
            >
                New Meeting
            </button>

            <button
                class="secondary"
                onclick="joinMeeting()"
            >
                Join Meeting
            </button>

        </div>

    </div>

    <div class="hero-card">

        <div class="screen">
            Video Meeting
        </div>

        <div class="controls">

            <div class="control">🎤</div>
            <div class="control">📹</div>
            <div class="control">🖥️</div>
            <div class="control">💬</div>

        </div>

    </div>

</section>

<script>

function createMeeting() {

    alert(
        "Meeting creation will be connected to the server next."
    );

}

function joinMeeting() {

    const id = prompt("Enter your Meeting ID:");

    if (id) {
        alert("Joining meeting: " + id);
    }

}

</script>

</body>
</html>
