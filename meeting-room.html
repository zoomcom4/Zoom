<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Meeting Room</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #101010;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */

        .topbar {
            height: 58px;
            flex-shrink: 0;
            background: #181818;
            border-bottom: 1px solid #303030;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 16px;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo {
            width: 34px;
            height: 24px;
            background: #2d8cff;
            border-radius: 7px;
            position: relative;
            flex-shrink: 0;
        }

        .logo::after {
            content: "";
            position: absolute;
            right: -9px;
            top: 6px;

            border-left: 10px solid #2d8cff;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        .meeting-info {
            min-width: 0;
        }

        .meeting-title {
            font-size: 14px;
            font-weight: 600;
        }

        .meeting-id {
            color: #a7a7a7;
            font-size: 11px;
            margin-top: 2px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-btn {
            height: 34px;
            border: 0;
            border-radius: 7px;
            background: #292929;
            color: #fff;
            padding: 0 12px;
            cursor: pointer;
        }

        .top-btn:hover {
            background: #363636;
        }

        /* MAIN */

        .main {
            position: relative;
            flex: 1;
            min-height: 0;
            padding: 10px;
            background: #0e0e0e;
        }

        .video-grid {
            width: 100%;
            height: 100%;

            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .video-tile {
            position: relative;
            overflow: hidden;
            border-radius: 9px;
            background: #202020;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 200px;
        }

        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            background: #000;
        }

        .avatar {
            width: 86px;
            height: 86px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #3d3d3d;
            font-size: 32px;
            font-weight: 600;
        }

        .participant-name {
            position: absolute;
            left: 10px;
            bottom: 10px;

            padding: 6px 9px;
            border-radius: 5px;

            background: rgba(0, 0, 0, .65);

            font-size: 13px;
            z-index: 3;
        }

        .participant-status {
            color: #bbb;
            margin-left: 5px;
        }

        .remote-placeholder {
            color: #aaa;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        /* CONNECTION STATUS */

        .connection-status {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px 12px;
            border-radius: 20px;

            background: rgba(0, 0, 0, .65);

            font-size: 12px;
            color: #ddd;

            z-index: 10;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f0b400;
        }

        .status-dot.connected {
            background: #20c878;
        }

        .status-dot.error {
            background: #e54848;
        }

        /* CONTROL BAR */

        .controls {
            height: 82px;
            flex-shrink: 0;

            background: #181818;
            border-top: 1px solid #303030;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 6px;
            padding: 8px;
        }

        .control {
            min-width: 70px;
            height: 62px;

            border: 0;
            border-radius: 8px;

            background: transparent;
            color: #fff;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 5px;

            cursor: pointer;
        }

        .control:hover {
            background: #2a2a2a;
        }

        .icon {
            font-size: 22px;
        }

        .control-label {
            font-size: 11px;
        }

        .control.off {
            color: #ff5b5b;
        }

        .leave {
            background: #d83b3b;
            min-width: 80px;
        }

        .leave:hover {
            background: #b82e2e;
        }

        /* SIDE PANEL */

        .panel {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;

            width: 340px;

            background: #1b1b1b;
            border-left: 1px solid #333;

            z-index: 50;

            transform: translateX(100%);
            transition: transform .2s ease;

            display: flex;
            flex-direction: column;
        }

        .panel.open {
            transform: translateX(0);
        }

        .panel-header {
            height: 58px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 16px;

            border-bottom: 1px solid #333;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
        }

        .close {
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .person {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
        }

        .small-avatar {
            width: 36px;
            height: 36px;

            border-radius: 50%;
            background: #404040;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 13px;
        }

        .person-name {
            font-size: 14px;
        }

        .host-label {
            color: #2d8cff;
            font-size: 11px;
            margin-left: 5px;
        }

        /* SCREEN SHARE REQUEST */

        .screen-request {
            position: fixed;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: min(390px, calc(100% - 30px));

            background: #242424;
            border: 1px solid #444;
            border-radius: 12px;

            padding: 24px;

            box-shadow: 0 15px 50px rgba(0, 0, 0, .6);

            z-index: 100;

            display: none;
        }

        .screen-request.show {
            display: block;
        }

        .screen-request h3 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .screen-request p {
            color: #bbb;
            font-size: 14px;
            line-height: 1.5;
        }

        .request-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        .request-btn {
            border: 0;
            border-radius: 7px;
            padding: 10px 15px;
            cursor: pointer;
            color: #fff;
            background: #3b3b3b;
        }

        .request-btn.accept {
            background: #2d8cff;
        }

        /* MESSAGE */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 105px;

            transform: translateX(-50%);

            background: rgba(0, 0, 0, .85);

            padding: 11px 16px;
            border-radius: 8px;

            font-size: 13px;

            display: none;

            z-index: 200;
        }

        .toast.show {
            display: block;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .topbar {
                padding: 0 11px;
            }

            .meeting-id {
                display: none;
            }

            .top-btn {
                padding: 0 8px;
                font-size: 12px;
            }

            .main {
                padding: 5px;
            }

            .video-grid {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(2, minmax(0, 1fr));
                gap: 5px;
            }

            .controls {
                height: 78px;
                overflow-x: auto;
                justify-content: flex-start;
            }

            .control {
                min-width: 61px;
            }

            .control-label {
                font-size: 10px;
            }

            .panel {
                width: 88%;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand-area">

        <div class="logo"></div>

        <div class="meeting-info">

            <div class="meeting-title">
                Meeting
            </div>

            <div
                class="meeting-id"
                id="meetingIdDisplay"
            >
                Meeting ID: —
            </div>

        </div>

    </div>

    <div class="top-actions">

        <button
            class="top-btn"
            id="securityBtn"
        >
            🔒 Security
        </button>

        <button
            class="top-btn"
            id="fullscreenBtn"
        >
            ⛶
        </button>

    </div>

</header>


<main class="main">

    <div class="connection-status">

        <span
            class="status-dot"
            id="statusDot"
        ></span>

        <span id="connectionText">
            Connecting...
        </span>

    </div>


    <div class="video-grid">

        <!-- LOCAL VIDEO -->

        <div class="video-tile">

            <video
                id="localVideo"
                autoplay
                muted
                playsinline
            ></video>

            <div
                class="avatar"
                id="localAvatar"
            >
                Y
            </div>

            <div class="participant-name">

                You

                <span
                    class="participant-status"
                    id="localMicStatus"
                >
                    🎤
                </span>

            </div>

        </div>


        <!-- REMOTE VIDEO -->

        <div class="video-tile">

            <video
                id="remoteVideo"
                autoplay
                playsinline
            ></video>

            <div
                class="avatar"
                id="remoteAvatar"
            >
                ?
            </div>

            <div
                class="remote-placeholder"
                id="remotePlaceholder"
            >
                Waiting for another participant...
            </div>

            <div class="participant-name">
                Participant
            </div>

        </div>

    </div>


    <!-- PANEL -->

    <aside
        class="panel"
        id="panel"
    >

        <div class="panel-header">

            <span
                class="panel-title"
                id="panelTitle"
            >
                Participants
            </span>

            <button
                class="close"
                id="closePanel"
            >
                ×
            </button>

        </div>

        <div
            class="panel-body"
            id="panelBody"
        ></div>

    </aside>

</main>


<footer class="controls">

    <!-- MICROPHONE -->

    <button
        class="control"
        id="micBtn"
    >

        <span
            class="icon"
            id="micIcon"
        >
            🎤
        </span>

        <span
            class="control-label"
            id="micLabel"
        >
            Mute
        </span>

    </button>


    <!-- CAMERA -->

    <button
        class="control"
        id="cameraBtn"
    >

        <span
            class="icon"
            id="cameraIcon"
        >
            📹
        </span>

        <span
            class="control-label"
            id="cameraLabel"
        >
            Stop Video
        </span>

    </button>


    <!-- SCREEN SHARE -->

    <button
        class="control"
        id="shareBtn"
    >

        <span class="icon">
            🖥️
        </span>

        <span class="control-label">
            Share Screen
        </span>

    </button>


    <!-- PARTICIPANTS -->

    <button
        class="control"
        id="participantsBtn"
    >

        <span class="icon">
            👥
        </span>

        <span class="control-label">
            Participants
        </span>

    </button>


    <!-- CHAT -->

    <button
        class="control"
        id="chatBtn"
    >

        <span class="icon">
            💬
        </span>

        <span class="control-label">
            Chat
        </span>

    </button>


    <!-- SETTINGS -->

    <button
        class="control"
        id="settingsBtn"
    >

        <span class="icon">
            ⚙️
        </span>

        <span class="control-label">
            Settings
        </span>

    </button>


    <!-- LEAVE -->

    <button
        class="control leave"
        id="leaveBtn"
    >

        <span class="icon">
            🚪
        </span>

        <span class="control-label">
            Leave
        </span>

    </button>

</footer>


<!-- SCREEN SHARE REQUEST -->

<div
    class="screen-request"
    id="screenRequest"
>

    <h3>
        Screen sharing requested
    </h3>

    <p id="screenRequestText">
        Another participant wants to share their screen with you.
    </p>

    <div class="request-actions">

        <button
            class="request-btn"
            id="declineShare"
        >
            Decline
        </button>

        <button
            class="request-btn accept"
            id="acceptShare"
        >
            Accept
        </button>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script type="module">

    import {
        db,
        auth
    } from "./firebase-config.js";

    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
        signInAnonymously
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    /* ===============================
       MEETING ID
    =============================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const meetingId =
        params.get("id") ||
        sessionStorage.getItem(
            "currentMeetingId"
        );


    const meetingIdDisplay =
        document.getElementById(
            "meetingIdDisplay"
        );


    if (meetingId) {

        meetingIdDisplay.textContent =
            "Meeting ID: " + meetingId;

    }


    /* ===============================
       ELEMENTS
    =============================== */

    const localVideo =
        document.getElementById(
            "localVideo"
        );

    const remoteVideo =
        document.getElementById(
            "remoteVideo"
        );

    const localAvatar =
        document.getElementById(
            "localAvatar"
        );

    const remoteAvatar =
        document.getElementById(
            "remoteAvatar"
        );

    const remotePlaceholder =
        document.getElementById(
            "remotePlaceholder"
        );

    const connectionText =
        document.getElementById(
            "connectionText"
        );

    const statusDot =
        document.getElementById(
            "statusDot"
        );

    const toast =
        document.getElementById(
            "toast"
        );

    const panel =
        document.getElementById(
            "panel"
        );

    const panelTitle =
        document.getElementById(
            "panelTitle"
        );

    const panelBody =
        document.getElementById(
            "panelBody"
        );


    /* ===============================
       TOAST
    =============================== */

    let toastTimer;

    function showToast(message) {

        toast.textContent =
            message;

        toast.classList.add(
            "show"
        );

        clearTimeout(
            toastTimer
        );

        toastTimer =
            setTimeout(() => {

                toast.classList.remove(
                    "show"
                );

            }, 3000);
    }


    /* ===============================
       MEETING VALIDATION
    =============================== */

    async function verifyMeeting() {

        if (!meetingId) {

            showToast(
                "No meeting ID was provided."
            );

            setTimeout(() => {

                location.href =
                    "join.html";

            }, 1500);

            return false;
        }


        try {

            if (!auth.currentUser) {

                await signInAnonymously(
                    auth
                );
            }


            const meetingRef =
                doc(
                    db,
                    "meetings",
                    meetingId
                );


            const snapshot =
                await getDoc(
                    meetingRef
                );


            if (!snapshot.exists()) {

                showToast(
                    "Meeting not found."
                );

                setTimeout(() => {

                    location.href =
                        "join.html";

                }, 1600);

                return false;
            }


            const meeting =
                snapshot.data();


            if (
                meeting.status &&
                meeting.status !== "active"
            ) {

                showToast(
                    "This meeting is no longer active."
                );

                setTimeout(() => {

                    location.href =
                        "join.html";

                }, 1600);

                return false;
            }


            sessionStorage.setItem(
                "currentMeetingId",
                meetingId
            );


            return true;

        } catch (error) {

            console.error(error);

            statusDot.classList.add(
                "error"
            );

            connectionText.textContent =
                "Connection error";

            showToast(
                "Unable to connect to the meeting."
            );

            return false;
        }
    }


    /* ===============================
       MEDIA
    =============================== */

    let localStream = null;

    let micEnabled = false;

    let cameraEnabled = false;


    async function startMedia() {

        try {

            localStream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio: true,
                        video: true
                    });


            localVideo.srcObject =
                localStream;


            micEnabled = true;

            cameraEnabled = true;


            localVideo.style.display =
                "block";

            localAvatar.style.display =
                "none";


            updateMediaButtons();


            showToast(
                "Camera and microphone connected."
            );

        } catch (error) {

            console.error(error);

            showToast(
                "Camera/microphone permission was not granted."
            );


            try {

                localStream =
                    await navigator.mediaDevices
                        .getUserMedia({
                            audio: true,
                            video: false
                        });


                micEnabled = true;

                cameraEnabled = false;


                localVideo.style.display =
                    "none";

                localAvatar.style.display =
                    "flex";


                updateMediaButtons();

            } catch (audioError) {

                console.error(
                    audioError
                );

                micEnabled = false;

                cameraEnabled = false;

                updateMediaButtons();
            }
        }
    }


    /* ===============================
       MEDIA BUTTONS
    =============================== */

    function updateMediaButtons() {

        const micBtn =
            document.getElementById(
                "micBtn"
            );

        const micIcon =
            document.getElementById(
                "micIcon"
            );

        const micLabel =
            document.getElementById(
                "micLabel"
            );


        const cameraBtn =
            document.getElementById(
                "cameraBtn"
            );

        const cameraIcon =
            document.getElementById(
                "cameraIcon"
            );

        const cameraLabel =
            document.getElementById(
                "cameraLabel"
            );


        if (micEnabled) {

            micIcon.textContent =
                "🎤";

            micLabel.textContent =
                "Mute";

            micBtn.classList.remove(
                "off"
            );

        } else {

            micIcon.textContent =
                "🔇";

            micLabel.textContent =
                "Unmute";

            micBtn.classList.add(
                "off"
            );
        }


        if (cameraEnabled) {
