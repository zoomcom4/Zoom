<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Zoom Meeting</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111827;
    color: white;
}

/* =========================
   JOIN SCREEN
========================= */

#joinScreen {
    width: 100%;
    height: 100vh;
    background: #f7f9fc;
    color: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.join-card {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 14px;
    padding: 35px 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,.12);
    text-align: center;
}

.logo {
    color: #2d8cff;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 30px;
}

.join-card h1 {
    margin: 0 0 10px;
    font-size: 26px;
}

.join-card p {
    color: #6b7280;
    font-size: 15px;
    line-height: 1.5;
}

.input {
    width: 100%;
    height: 54px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 0 16px;
    font-size: 17px;
    margin-top: 20px;
    outline: none;
}

.input:focus {
    border-color: #2d8cff;
}

.join-button {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 8px;
    background: #2d8cff;
    color: white;
    font-size: 17px;
    font-weight: 600;
    margin-top: 15px;
    cursor: pointer;
}

.join-button:active {
    transform: scale(.98);
}

/* =========================
   MEETING SCREEN
========================= */

#meetingScreen {
    display: none;
    width: 100%;
    height: 100vh;
    background: #111827;
    flex-direction: column;
}

/* TOP BAR */

.topbar {
    height: 64px;
    flex-shrink: 0;
    background: #1f2937;
    border-bottom: 1px solid #374151;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.top-logo {
    color: #2d8cff;
    font-size: 25px;
    font-weight: 700;
}

.meeting-number {
    color: #d1d5db;
    font-size: 14px;
}

/* VIDEO AREA */

.video-area {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.video-container {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    background: #090f1c;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    border: 1px solid #374151;
}

/* FAKE VIDEO TILES */

.video-tile {
    position: absolute;
    background: #182233;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.main-tile {
    inset: 0;
}

.avatar {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: #374151;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
}

.name-label {
    position: absolute;
    bottom: 15px;
    left: 15px;
    background: rgba(0,0,0,.55);
    padding: 7px 11px;
    border-radius: 5px;
    font-size: 13px;
}

/* JOINING */

.joining {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(9,15,28,.75);
    z-index: 4;
}

.spinner {
    width: 46px;
    height: 46px;
    border: 4px solid #374151;
    border-top-color: #2d8cff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.joining h2 {
    margin: 0 0 8px;
    font-size: 21px;
    font-weight: 500;
}

.joining p {
    margin: 0;
    color: #9ca3af;
    font-size: 14px;
}

/* ERROR */

.error-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.42);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 8;
}

.error-card {
    width: min(90%, 440px);
    background: white;
    color: #111827;
    border-radius: 14px;
    padding: 30px 25px;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0,0,0,.45);
}

.error-icon {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #fee2e2;
    color: #dc2626;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 29px;
    font-weight: bold;
}

.error-card h2 {
    margin: 0 0 10px;
    font-size: 21px;
}

.error-card p {
    margin: 0;
    color: #6b7280;
    line-height: 1.5;
}

/* CONTROLS */

.controls {
    height: 82px;
    flex-shrink: 0;
    background: #1f2937;
    border-top: 1px solid #374151;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

.control {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #374151;
    color: white;
    font-size: 19px;
}

.leave {
    width: auto;
    padding: 0 20px;
    border-radius: 7px;
    background: #dc2626;
    font-size: 14px;
}

/* MOBILE */

@media(max-width:600px) {

    .topbar {
        height: 58px;
        padding: 0 15px;
    }

    .top-logo {
        font-size: 22px;
    }

    .video-area {
        padding: 10px;
    }

    .controls {
        height: 72px;
        gap: 8px;
    }

    .control {
        width: 44px;
        height: 44px;
        font-size: 17px;
    }

    .leave {
        padding: 0 14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     JOIN MEETING SCREEN
========================= -->

<section id="joinScreen">

    <div class="join-card">

        <div class="logo">Zoom</div>

        <h1>Join Meeting</h1>

        <p>
            Enter the meeting ID or personal link name
            provided by the meeting host.
        </p>

        <input
            id="meetingInput"
            class="input"
            type="text"
            placeholder="Meeting ID"
            autocomplete="off"
        >

        <button
            class="join-button"
            onclick="startMeeting()">
            Join
        </button>

    </div>

</section>


<!-- =========================
     VIDEO MEETING SCREEN
========================= -->

<section id="meetingScreen">

    <header class="topbar">

        <div class="top-logo">
            Zoom
        </div>

        <div
            class="meeting-number"
            id="meetingNumber">
            Meeting
        </div>

    </header>


    <main class="video-area">

        <div class="video-container">

            <div class="video-tile main-tile">

                <div class="avatar">
                    👤
                </div>

                <div class="name-label">
                    You
                </div>

            </div>


            <!-- JOINING MESSAGE -->

            <div
                class="joining"
                id="joining">

                <div class="spinner"></div>

                <h2>
                    Joining meeting...
                </h2>

                <p id="joiningText">
                    Connecting to the meeting
                </p>

            </div>


            <!-- ERROR -->

            <div
                class="error-overlay"
                id="errorOverlay">

                <div class="error-card">

                    <div class="error-icon">
                        !
                    </div>

                    <h2>
                        Cannot join at this time
                    </h2>

                    <p>
                        The meeting could not be joined
                        right now. Please try again later.
                    </p>

                </div>

            </div>

        </div>

    </main>


    <footer class="controls">

        <button class="control">
            🎤
        </button>

        <button class="control">
            📹
        </button>

        <button class="control">
            💬
        </button>

        <button class="control">
            👥
        </button>

        <button
            class="control leave"
            onclick="goHome()">
            Leave
        </button>

    </footer>

</section>


<script>

const params =
    new URLSearchParams(window.location.search);

const meetingFromURL =
    params.get("meeting");


// If a meeting ID was supplied,
// immediately start the meeting flow.

if (meetingFromURL) {

    startMeeting(meetingFromURL);

}


// Start meeting

function startMeeting(id) {

    let meetingId = id;

    if (!meetingId) {

        meetingId =
            document
            .getElementById("meetingInput")
            .value
            .trim();

    }


    // Don't continue without an ID.

    if (!meetingId) {

        alert("Please enter a meeting ID.");

        return;

    }


    // Show meeting screen

    document
        .getElementById("joinScreen")
        .style.display = "none";

    document
        .getElementById("meetingScreen")
        .style.display = "flex";


    document
        .getElementById("meetingNumber")
        .textContent =
        "Meeting " + meetingId;


    // Joining state

    const joining =
        document.getElementById("joining");

    const joiningText =
        document.getElementById("joiningText");

    joining.style.display = "flex";

    joiningText.textContent =
        "Connecting to the meeting";


    /*
       Simulated connection sequence.

       This is only a UI simulation.
       No camera, microphone, or screen
       is accessed.
    */

    setTimeout(function() {

        joiningText.textContent =
            "Checking meeting connection...";

    }, 1200);


    setTimeout(function() {

        joiningText.textContent =
            "Connecting to meeting server...";

    }, 2400);


    setTimeout(function() {

        joining.style.display = "none";

        document
            .getElementById("errorOverlay")
            .style.display = "flex";


        // Return to landing page
        // after showing the error.

        setTimeout(function() {

            goHome();

        }, 3500);

    }, 4000);

}


// Return to homepage

function goHome() {

    window.location.href =
        "index.html";

}

</script>

</body>
</html>
