<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#222222"
    >

    <title>New Meeting</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;

            background: #222222;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 90px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            border-bottom: 1px solid #383838;
        }

        .back {
            border: none;
            background: none;

            color: #4b9cff;

            font-size: 18px;

            cursor: pointer;
        }

        .title {
            flex: 1;

            text-align: center;

            font-size: 21px;
            font-weight: 700;

            margin-right: 55px;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 60px 24px 40px;
        }

        .icon {
            width: 72px;
            height: 72px;

            border-radius: 22px;

            background: #1478f2;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 28px;
        }

        .icon svg {
            width: 36px;
            height: 36px;

            fill: none;

            stroke: white;

            stroke-width: 2;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;

            margin-bottom: 10px;

            text-align: center;
        }

        .description {
            color: #a9a9ad;

            font-size: 16px;
            line-height: 1.45;

            text-align: center;

            max-width: 350px;

            margin-bottom: 38px;
        }

        /* =========================
           MEETING CARD
        ========================= */

        .meeting-card {
            width: 100%;
            max-width: 420px;

            padding: 25px 22px;

            border-radius: 22px;

            background: #303033;

            border: 1px solid #3d3d40;

            text-align: center;
        }

        .label {
            color: #a9a9ad;

            font-size: 14px;

            margin-bottom: 9px;
        }

        .meeting-id {
            font-size: 32px;

            font-weight: 700;

            letter-spacing: 3px;

            margin-bottom: 20px;
        }

        .share-link {
            width: 100%;

            padding: 13px 12px;

            border-radius: 12px;

            background: #242426;

            color: #a9a9ad;

            font-size: 13px;

            word-break: break-all;
        }

        /* =========================
           START BUTTON
        ========================= */

        .start-button {
            width: 100%;
            max-width: 420px;

            height: 58px;

            margin-top: 25px;

            border: none;

            border-radius: 18px;

            background: #1478f2;

            color: white;

            font-size: 19px;

            font-weight: 700;

            cursor: pointer;
        }

        .start-button:active {
            transform: scale(.98);
        }

        .start-button:disabled {
            opacity: .6;

            cursor: default;
        }

        /* =========================
           COPY BUTTON
        ========================= */

        .copy-button {
            width: 100%;
            max-width: 420px;

            height: 54px;

            margin-top: 12px;

            border: none;

            border-radius: 17px;

            background: #3a3a3d;

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            min-height: 24px;

            margin-top: 15px;

            color: #a9a9ad;

            font-size: 14px;

            text-align: center;
        }

        .status.success {
            color: #49d17d;
        }

        .status.error {
            color: #ff7373;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-height: 700px) {

            .content {
                padding-top: 35px;
            }

            .icon {
                margin-bottom: 18px;
            }

            .description {
                margin-bottom: 25px;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <!-- HEADER -->

    <header class="header">

        <button
            class="back"
            type="button"
            onclick="goBack()"
        >
            Cancel
        </button>

        <div class="title">
            New Meeting
        </div>

    </header>


    <!-- CONTENT -->

    <main class="content">

        <div class="icon">

            <svg
                viewBox="0 0 24 24"
            >

                <path
                    d="M8 12h8"
                />

                <path
                    d="M12 8v8"
                />

            </svg>

        </div>


        <h1>
            Start a new meeting
        </h1>


        <p class="description">
            Your meeting is ready. Share the meeting ID
            with the people you want to invite.
        </p>


        <!-- MEETING INFORMATION -->

        <div
            id="meetingCard"
            class="meeting-card"
        >

            <div class="label">
                Meeting ID
            </div>

            <div
                id="meetingId"
                class="meeting-id"
            >
                ---
            </div>

            <div
                id="shareLink"
                class="share-link"
            >
                Preparing meeting link...
            </div>

        </div>


        <!-- START -->

        <button
            id="startButton"
            class="start-button"
            type="button"
        >
            Start Meeting
        </button>


        <!-- COPY -->

        <button
            id="copyButton"
            class="copy-button"
            type="button"
        >
            Copy Meeting Link
        </button>


        <div
            id="status"
            class="status"
        >
        </div>

    </main>

</div>


<script type="module">

    /* =====================================
       FIREBASE
    ===================================== */

    import {
        db,
        auth
    } from "./firebase-config.js";


    import {
        signInAnonymously
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        doc,
        setDoc,
        getDoc,
        serverTimestamp
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* =====================================
       ELEMENTS
    ===================================== */

    const meetingIdElement =
        document.getElementById(
            "meetingId"
        );


    const shareLinkElement =
        document.getElementById(
            "shareLink"
        );


    const startButton =
        document.getElementById(
            "startButton"
        );


    const copyButton =
        document.getElementById(
            "copyButton"
        );


    const statusElement =
        document.getElementById(
            "status"
        );


    /* =====================================
       GET MEETING ID
    ===================================== */

    function getMeetingId() {

        /*
         * First check the URL.
         *
         * Example:
         *
         * meeting.html?id=123456789
         */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const urlId =
            params.get("id");


        if (urlId) {

            return urlId;

        }


        /*
         * If there is no URL ID,
         * use the ID stored by index.html.
         */

        const storedId =
            sessionStorage.getItem(
                "meetingId"
            );


        return storedId;

    }


    /* =====================================
       FORMAT ID
    ===================================== */

    function formatMeetingId(id) {

        if (!id) {
            return "---";
        }


        if (id.length !== 9) {
            return id;
        }


        return (
            id.substring(0, 3)
            + " "
            + id.substring(3, 6)
            + " "
            + id.substring(6, 9)
        );

    }


    /* =====================================
       MEETING ID
    ===================================== */

    const meetingId =
        getMeetingId();


    if (!meetingId) {

        meetingIdElement.textContent =
            "Unavailable";

        shareLinkElement.textContent =
            "No meeting ID was provided.";

        startButton.disabled =
            true;

        statusElement.textContent =
            "Please return to the home page and create a new meeting.";

        statusElement.classList.add(
            "error"
        );

    } else {

        /*
         * Display existing ID.
         */

        meetingIdElement.textContent =
            formatMeetingId(
                meetingId
            );


        /*
         * Build join URL.
         */

        const joinUrl =
            window.location.origin
            + "/join.html?meeting="
            + encodeURIComponent(
                meetingId
            );


        shareLinkElement.textContent =
            joinUrl;


        /*
         * Save it again so every page
         * uses the same meeting.
         */

        sessionStorage.setItem(
            "currentMeetingId",
            meetingId
        );

    }


    /* =====================================
       CREATE FIRESTORE MEETING
    ===================================== */

    async function prepareMeeting() {

        if (!meetingId) {
            return false;
        }


        /*
         * Use existing Firebase user
         * if one exists.
         */

        let user =
            auth.currentUser;


        /*
         * Otherwise create an anonymous
         * Firebase user.
         */

        if (!user) {

            statusElement.textContent =
                "Preparing secure meeting...";

            try {

                const result =
                    await signInAnonymously(
                        auth
                    );

                user =
                    result.user;

            } catch (error) {

                console.error(
                    "Anonymous authentication failed:",
                    error
                );

                statusElement.textContent =
                    "Unable to authenticate. Please try again.";

                statusElement.classList.add(
                    "error"
                );

                return false;

            }

        }


        /*
         * Check whether the meeting already
         * exists.
         */

        const meetingRef =
            doc(
                db,
                "meetings",
                meetingId
            );


        const existingMeeting =
            await getDoc(
                meetingRef
            );


        /*
         * Don't overwrite an existing
         * meeting belonging to another host.
         */

        if (
            existingMeeting.exists()
        ) {

            const existingData =
                existingMeeting.data();


            if (
                existingData.hostId &&
                existingData.hostId !== user.uid
            ) {

                statusElement.textContent =
                    "This meeting ID is already in use. Please create a new meeting.";

                statusElement.classList.add(
                    "error"
                );

                return false;

            }

        }


        /*
         * Create/update meeting.
         */

        await setDoc(
            meetingRef,
            {

                meetingId:
                    meetingId,

                hostId:
                    user.uid,

                status:
                    "active",

                createdAt:
                    existingMeeting.exists()
                        ? existingMeeting.data().createdAt
                        : serverTimestamp()

            },
            {
                merge: true
            }
        );


        /*
         * Save host information.
         */

        sessionStorage.setItem(
            "meetingHostId",
            user.uid
        );


        return true;

    }


    /* =====================================
       START MEETING
    ===================================== */

    startButton.addEventListener(
        "click",
        async function() {

            if (!meetingId) {
                return;
            }


            startButton.disabled =
                true;

            startButton.textContent =
                "Preparing meeting...";


            statusElement.textContent =
                "";


            try {

                const ready =
                    await prepareMeeting();


                if (!ready) {

                    startButton.disabled =
                        false;

                    startButton.textContent =
                        "Start Meeting";

                    return;

                }


                /*
                 * IMPORTANT:
                 * Keep the exact same meeting ID.
                 */

                window.location.href =
                    "meeting-room.html?id="
                    + encodeURIComponent(
                        meetingId
                    );

            } catch (error) {

                console.error(error);

                statusElement.textContent =
                    "Unable to start the meeting. Please try again.";

                statusElement.classList.add(
                    "error"
                );

                startButton.disabled =
                    false;

                startButton.textContent =
                    "Start Meeting";

            }

        }
    );


    /* =====================================
       COPY LINK
    ===================================== */

    copyButton.addEventListener(
        "click",
        async function() {

            if (!meetingId) {
                return;
            }


            const joinUrl =
                window.location.origin
                + "/join.html?meeting="
                + encodeURIComponent(
                    meetingId
                );


            try {

                await navigator.clipboard.writeText(
                    joinUrl
                );


                copyButton.textContent =
                    "Copied!";


                statusElement.textContent =
                    "Meeting link copied.";


                statusElement.classList.remove(
                    "error"
                );


                statusElement.classList.add(
                    "success"
                );


                setTimeout(
                    function() {

                        copyButton.textContent =
                            "Copy Meeting Link";

                        statusElement.textContent =
                            "";

                        statusElement.classList.remove(
                            "success"
                        );

                    },
                    2000
                );


            } catch (error) {

                console.error(error);

                statusElement.textContent =
                    "Unable to copy the link.";

                statusElement.classList.add(
                    "error"
                );

            }

        }
    );


    /* =====================================
       CANCEL
    ===================================== */

    window.goBack =
        function() {

            window.location.href =
                "index.html";

        };


</script>

</body>

</html>
