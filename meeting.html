<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#222222">

    <title>New Meeting</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;

            background: #222222;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            height: 90px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            border-bottom: 1px solid #383838;
        }

        .back {
            border: none;
            background: none;

            color: #4b9cff;

            font-size: 18px;

            cursor: pointer;
        }

        .title {
            flex: 1;

            text-align: center;

            font-size: 21px;
            font-weight: 700;

            margin-right: 55px;
        }

        /* CONTENT */

        .content {
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 70px 24px 40px;
        }

        .icon {
            width: 72px;
            height: 72px;

            border-radius: 22px;

            background: #1478f2;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;

            margin-bottom: 28px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;

            margin-bottom: 10px;

            text-align: center;
        }

        .description {
            color: #a9a9ad;

            font-size: 16px;
            line-height: 1.45;

            text-align: center;

            max-width: 340px;

            margin-bottom: 42px;
        }

        /* MEETING CARD */

        .meeting-card {
            width: 100%;
            max-width: 420px;

            padding: 25px 22px;

            border-radius: 22px;

            background: #303033;

            border: 1px solid #3d3d40;

            text-align: center;
        }

        .label {
            color: #a9a9ad;

            font-size: 14px;

            margin-bottom: 9px;
        }

        .meeting-id {
            font-size: 32px;
            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 20px;
        }

        .share-link {
            width: 100%;

            padding: 13px 12px;

            border-radius: 12px;

            background: #242426;

            color: #a9a9ad;

            font-size: 13px;

            word-break: break-all;
        }

        /* BUTTON */

        .start-button {
            width: 100%;
            max-width: 420px;

            height: 58px;

            margin-top: 25px;

            border: none;
            border-radius: 18px;

            background: #1478f2;

            color: white;

            font-size: 19px;
            font-weight: 700;

            cursor: pointer;
        }

        .start-button:active {
            transform: scale(.98);
        }

        .copy-button {
            width: 100%;
            max-width: 420px;

            height: 54px;

            margin-top: 12px;

            border: none;
            border-radius: 17px;

            background: #3a3a3d;

            color: white;

            font-size: 17px;
            font-weight: 600;

            cursor: pointer;
        }

        .status {
            min-height: 24px;

            margin-top: 15px;

            color: #a9a9ad;

            font-size: 14px;

            text-align: center;
        }

        /* MOBILE */

        @media (max-height: 700px) {

            .content {
                padding-top: 35px;
            }

            .icon {
                margin-bottom: 18px;
            }

            .description {
                margin-bottom: 25px;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <header class="header">

        <button
            class="back"
            onclick="history.back()"
        >
            Cancel
        </button>

        <div class="title">
            New Meeting
        </div>

    </header>


    <main class="content">

        <div class="icon">
            +
        </div>


        <h1>
            Start a new meeting
        </h1>


        <p class="description">
            Create a meeting and share the meeting ID
            with the person you want to call.
        </p>


        <div
            id="meetingCard"
            class="meeting-card"
            style="display:none;"
        >

            <div class="label">
                Meeting ID
            </div>

            <div
                id="meetingId"
                class="meeting-id"
            >
                ---
            </div>

            <div
                id="shareLink"
                class="share-link"
            >
            </div>

        </div>


        <button
            id="startButton"
            class="start-button"
        >
            Start New Meeting
        </button>


        <button
            id="copyButton"
            class="copy-button"
            style="display:none;"
        >
            Copy Meeting Link
        </button>


        <div
            id="status"
            class="status"
        >
        </div>

    </main>

</div>


<script type="module">

    /*
     * IMPORTANT:
     * This imports the Firebase connection
     * you already created for your project.
     */

    import {
        db,
        auth
    } from "./firebase-config.js";

    import {
        collection,
        doc,
        setDoc,
        serverTimestamp
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const startButton =
        document.getElementById("startButton");

    const copyButton =
        document.getElementById("copyButton");

    const meetingCard =
        document.getElementById("meetingCard");

    const meetingIdElement =
        document.getElementById("meetingId");

    const shareLinkElement =
        document.getElementById("shareLink");

    const statusElement =
        document.getElementById("status");


    /*
     * Generate a 9-digit Meeting ID.
     */

    function generateMeetingId() {

        const min = 100000000;
        const max = 999999999;

        return String(
            Math.floor(
                Math.random() *
                (max - min + 1)
            ) + min
        );

    }


    /*
     * Create the meeting.
     */

    async function createMeeting() {

        startButton.disabled = true;

        startButton.textContent =
            "Creating meeting...";

        statusElement.textContent = "";


        try {

            /*
             * Make sure the user is signed in.
             */

            const user =
                auth.currentUser;


            if (!user) {

                statusElement.textContent =
                    "Please sign in before starting a meeting.";

                startButton.disabled = false;

                startButton.textContent =
                    "Start New Meeting";

                return;
            }


            /*
             * Generate ID.
             */

            const meetingId =
                generateMeetingId();


            /*
             * Create meeting document.
             */

            await setDoc(
                doc(
                    db,
                    "meetings",
                    meetingId
                ),
                {

                    meetingId: meetingId,

                    hostId: user.uid,

                    status: "active",

                    createdAt:
                        serverTimestamp()

                }
            );


            /*
             * Create shareable URL.
             */

            const shareUrl =
                window.location.origin +
                "/join.html?meeting=" +
                encodeURIComponent(
                    meetingId
                );


            /*
             * Display information.
             */

            meetingIdElement.textContent =
                meetingId;

            shareLinkElement.textContent =
                shareUrl;


            meetingCard.style.display =
                "block";


            copyButton.style.display =
                "block";


            startButton.textContent =
                "Meeting Created";


            statusElement.textContent =
                "Share this meeting link with your guest.";


            /*
             * Store the ID locally so the
             * next meeting page can use it.
             */

            sessionStorage.setItem(
                "currentMeetingId",
                meetingId
            );


        } catch (error) {

            console.error(error);

            statusElement.textContent =
                "Unable to create the meeting. Please try again.";

            startButton.disabled = false;

            startButton.textContent =
                "Start New Meeting";

        }

    }


    /*
     * Copy share link.
     */

    async function copyMeetingLink() {

        const link =
            shareLinkElement.textContent;


        try {

            await navigator.clipboard.writeText(
                link
            );

            copyButton.textContent =
                "Copied!";


            setTimeout(() => {

                copyButton.textContent =
                    "Copy Meeting Link";

            }, 2000);


        } catch (error) {

            statusElement.textContent =
                "Copy failed. Please copy the link manually.";

        }

    }


    startButton.addEventListener(
        "click",
        createMeeting
    );


    copyButton.addEventListener(
        "click",
        copyMeetingLink
    );

</script>

</body>
</html>
