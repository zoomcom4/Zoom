<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Start Meeting | Zoom</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #1f1f1f;
            color: #fff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 70px 20px 60px;
        }

        .container {
            width: 100%;
            max-width: 760px;
            text-align: center;
        }

        .plus {
            width: 145px;
            height: 145px;
            margin: 0 auto 55px;
            border-radius: 38px;
            background: #1976f3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            font-weight: 300;
        }

        h1 {
            margin: 0;
            font-size: 52px;
            line-height: 1.1;
            font-weight: 700;
        }

        .subtitle {
            margin: 28px auto 55px;
            max-width: 650px;
            color: #b7b7b7;
            font-size: 24px;
            line-height: 1.45;
        }

        .meeting-card {
            background: #2d2d30;
            border: 1px solid #454549;
            border-radius: 30px;
            padding: 48px 38px;
            margin-bottom: 28px;
        }

        .meeting-label {
            color: #bdbdc1;
            font-size: 25px;
            margin-bottom: 22px;
        }

        .meeting-id {
            font-size: 54px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .join-link {
            background: #202022;
            border-radius: 22px;
            padding: 25px 20px;
            color: #bdbdc1;
            font-size: 19px;
            line-height: 1.45;
            word-break: break-all;
        }

        .button {
            width: 100%;
            height: 105px;
            border: none;
            border-radius: 28px;
            font-size: 25px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }

        .start {
            background: #2684f5;
            color: #fff;
        }

        .start:active {
            transform: scale(.99);
        }

        .copy {
            background: #3a3a3d;
            color: #fff;
        }

        .message {
            min-height: 30px;
            margin-top: 25px;
            color: #ff6b6b;
            font-size: 19px;
            line-height: 1.4;
        }

        .success {
            color: #5edb88;
        }

        .loading {
            opacity: .65;
            pointer-events: none;
        }

        @media (max-width: 600px) {

            .page {
                padding: 25px 20px 50px;
            }

            .plus {
                width: 145px;
                height: 145px;
                margin-bottom: 38px;
            }

            h1 {
                font-size: 46px;
            }

            .subtitle {
                font-size: 21px;
                margin-bottom: 45px;
            }

            .meeting-card {
                padding: 40px 20px;
                border-radius: 28px;
            }

            .meeting-id {
                font-size: 42px;
                letter-spacing: 1px;
            }

            .join-link {
                font-size: 16px;
            }

            .button {
                height: 95px;
                font-size: 23px;
                border-radius: 25px;
            }

        }

    </style>

</head>


<body>

<div class="page">

    <div class="container">

        <div class="plus">
            +
        </div>

        <h1>
            Start a new meeting
        </h1>

        <div class="subtitle">
            Your meeting is ready. Share the meeting ID
            with the people you want to invite.
        </div>


        <div class="meeting-card">

            <div class="meeting-label">
                Meeting ID
            </div>

            <div
                class="meeting-id"
                id="meetingId"
            >
                ---------
            </div>

            <div
                class="join-link"
                id="joinLink"
            >
                Creating meeting link...
            </div>

        </div>


        <button
            class="button start"
            id="startButton"
        >
            Start Meeting
        </button>


        <button
            class="button copy"
            id="copyButton"
        >
            Copy Meeting Link
        </button>


        <div
            class="message"
            id="message"
        ></div>

    </div>

</div>


<script type="module">

import {
    db,
    auth
} from "./firebase-config.js";


import {
    signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ============================================================
// ELEMENTS
// ============================================================

const meetingIdElement =
    document.getElementById("meetingId");

const joinLinkElement =
    document.getElementById("joinLink");

const startButton =
    document.getElementById("startButton");

const copyButton =
    document.getElementById("copyButton");

const messageElement =
    document.getElementById("message");


// ============================================================
// GET MEETING ID
// ============================================================

const params =
    new URLSearchParams(
        window.location.search
    );


let meetingId =
    params.get("id");


if (!meetingId) {

    meetingId =
        sessionStorage.getItem(
            "meetingId"
        );

}


// ============================================================
// VALIDATE MEETING ID
// ============================================================

meetingId =
    String(meetingId || "")
        .replace(/\D/g, "")
        .slice(0, 9);


if (meetingId.length !== 9) {

    showError(
        "No valid meeting ID was found. Please return to the home page and create a new meeting."
    );

} else {

    sessionStorage.setItem(
        "meetingId",
        meetingId
    );

    sessionStorage.setItem(
        "currentMeetingId",
        meetingId
    );


    meetingIdElement.textContent =
        formatMeetingId(
            meetingId
        );


    /*
     * IMPORTANT:
     *
     * This uses the current page location
     * so /Zoom/ is preserved.
     *
     * Example:
     * https://zoomcom4.github.io/Zoom/join.html?meeting=123456789
     */

    const joinUrl =
        new URL(
            "join.html?meeting=" +
            encodeURIComponent(
                meetingId
            ),
            window.location.href
        ).href;


    joinLinkElement.textContent =
        joinUrl;


    startButton.addEventListener(
        "click",
        startMeeting
    );


    copyButton.addEventListener(
        "click",
        copyMeetingLink
    );

}


// ============================================================
// START MEETING
// ============================================================

async function startMeeting() {

    if (
        meetingId.length !== 9
    ) {

        showError(
            "Invalid meeting ID."
        );

        return;

    }


    setLoading(
        true
    );


    try {

        /*
         * Authenticate anonymously.
         *
         * Anonymous Firebase users are still
         * authenticated users and receive a UID.
         */

        let user =
            auth.currentUser;


        if (!user) {

            const result =
                await signInAnonymously(
                    auth
                );

            user =
                result.user;

        }


        /*
         * IMPORTANT:
         *
         * We use doc(), NOT collection().
         *
         * The meeting is one document:
         *
         * meetings
         *    └── 123456789
         */

        const meetingRef =
            doc(
                db,
                "meetings",
                meetingId
            );


        const existingMeeting =
            await getDoc(
                meetingRef
            );


        /*
         * If the meeting already exists,
         * make sure it belongs to this host.
         */

        if (
            existingMeeting.exists()
        ) {

            const existingData =
                existingMeeting.data();


            if (
                existingData.hostId &&
                existingData.hostId !==
                user.uid
            ) {

                /*
                 * The ID belongs to another
                 * host, so don't take over it.
                 */

                showError(
                    "This meeting ID is already being used by another host. Please create a new meeting."
                );

                setLoading(
                    false
                );

                return;

            }

        }


        /*
         * Create/update the meeting document.
         */

        await setDoc(
            meetingRef,
            {

                meetingId:
                    meetingId,

                hostId:
                    user.uid,

                status:
                    "active",

                createdAt:
                    existingMeeting.exists()
                        ? (
                            existingMeeting
                                .data()
                                .createdAt ||
                            serverTimestamp()
                          )
                        : serverTimestamp()

            },
            {
                merge: true
            }
        );


        /*
         * Save meeting information locally.
         */

        sessionStorage.setItem(
            "currentMeetingId",
            meetingId
        );

        sessionStorage.setItem(
            "meetingHostId",
            user.uid
        );

        sessionStorage.setItem(
            "joiningAsGuest",
            "false"
        );


        /*
         * Go to the actual meeting room.
         */

        window.location.href =
            "./meeting-room.html?id=" +
            encodeURIComponent(
                meetingId
            );


    } catch (error) {

        console.error(
            "START MEETING ERROR:",
            error
        );


        showError(
            error.message ||
            "Unable to start the meeting. Please try again."
        );


        setLoading(
            false
        );

    }

}


// ============================================================
// COPY LINK
// ============================================================

async function copyMeetingLink() {

    const url =
        joinLinkElement.textContent.trim();


    if (!url) {
        return;
    }


    try {

        await navigator.clipboard.writeText(
            url
        );


        messageElement.textContent =
            "Meeting link copied.";

        messageElement.className =
            "message success";


        setTimeout(
            () => {

                messageElement.textContent =
                    "";

            },
            2500
        );


    } catch (error) {

        /*
         * Fallback for browsers where
         * navigator.clipboard is unavailable.
         */

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value =
            url;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();


        messageElement.textContent =
            "Meeting link copied.";

        messageElement.className =
            "message success";

    }

}


// ============================================================
// FORMAT ID
// ============================================================

function formatMeetingId(
    id
) {

    if (
        id.length !== 9
    ) {

        return id;

    }


    return (
        id.substring(0, 3) +
        " " +
        id.substring(3, 6) +
        " " +
        id.substring(6, 9)
    );

}


// ============================================================
// ERROR
// ============================================================

function showError(
    text
) {

    messageElement.textContent =
        text;

    messageElement.className =
        "message";

}


// ============================================================
// LOADING
// ============================================================

function setLoading(
    loading
) {

    if (loading) {

        startButton.classList.add(
            "loading"
        );

        startButton.textContent =
            "Starting Meeting...";

    } else {

        startButton.classList.remove(
            "loading"
        );

        startButton.textContent =
            "Start Meeting";

    }

}

</script>

</body>

</html>
