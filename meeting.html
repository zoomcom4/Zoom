<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zoom Meeting</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: white;
      min-height: 100vh;
      overflow: hidden;
    }

    .meeting {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #181818;
      border-bottom: 1px solid #292929;
    }

    .zoom-logo {
      font-size: 23px;
      font-weight: 700;
      color: #2d8cff;
    }

    .meeting-info {
      text-align: right;
    }

    .meeting-info small {
      display: block;
      color: #a9a9a9;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .meeting-info span {
      font-size: 13px;
    }

    /* Main area */
    .stage {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at center, #252525 0%, #111111 65%);
    }

    .video-area {
      width: 100%;
      max-width: 850px;
      min-height: 430px;
      border-radius: 14px;
      background: #202020;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #303030;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #3b3b3b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 600;
      color: #ddd;
    }

    .participant-name {
      position: absolute;
      left: 16px;
      bottom: 14px;
      font-size: 13px;
      background: rgba(0,0,0,.55);
      padding: 7px 10px;
      border-radius: 5px;
    }

    /* Permission card */
    .permission-card {
      position: absolute;
      width: calc(100% - 40px);
      max-width: 430px;
      background: #ffffff;
      color: #222;
      border-radius: 14px;
      padding: 27px 24px 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,.5);
      text-align: center;
      z-index: 5;
    }

    .share-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 17px;
      border-radius: 50%;
      background: #eaf3ff;
      color: #2d8cff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
    }

    .permission-card h1 {
      font-size: 21px;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .permission-card p {
      color: #666;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .allow-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #2d8cff;
      color: white;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .allow-btn:active {
      transform: scale(.99);
    }

    .status {
      display: none;
      margin-top: 15px;
      font-size: 13px;
      color: #555;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #ddd;
      border-top-color: #2d8cff;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 7px;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Bottom controls */
    .controls {
      min-height: 82px;
      background: #181818;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      border-top: 1px solid #292929;
    }

    .control {
      text-align: center;
      color: #aaa;
      font-size: 11px;
    }

    .control-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 5px;
      font-size: 17px;
    }

    /* Shared screen */
    .shared-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 4;
    }

    .shared-screen video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sharing-label {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0,0,0,.7);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 2;
    }

    .stop-sharing {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #d93025;
      border: 0;
      color: white;
      padding: 11px 18px;
      border-radius: 7px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .stage {
        padding: 12px;
      }

      .video-area {
        min-height: 390px;
      }

      .permission-card {
        max-width: 360px;
      }

      .controls {
        gap: 16px;
      }
    }
  </style>
</head>

<body>

<div class="meeting">

  <div class="topbar">
    <div class="zoom-logo">Zoom</div>

    <div class="meeting-info">
      <small>Meeting ID</small>
      <span id="meetingId">Loading...</span>
    </div>
  </div>


  <main class="stage">

    <div class="video-area">

      <div class="avatar">G</div>

      <div class="participant-name">
        You
      </div>

      <!-- Shared screen preview -->
      <div class="shared-screen" id="sharedScreen">

        <div class="sharing-label">
          Screen sharing is active
        </div>

        <video
          id="screenPreview"
          autoplay
          muted
          playsinline>
        </video>

        <button
          class="stop-sharing"
          id="stopSharing">
          Stop Sharing
        </button>

      </div>

    </div>


    <!-- Permission dialog -->
    <div class="permission-card" id="permissionCard">

      <div class="share-icon">
        ▣
      </div>

      <h1>
        Allow screen sharing to join this host's Zoom call
      </h1>

      <p>
        To join this support session, allow screen sharing when your
        browser or device asks for permission.
      </p>

      <button
        class="allow-btn"
        id="allowSharing">
        Allow Screen Sharing
      </button>

      <div class="status" id="status">
        <span class="spinner"></span>
        Requesting screen-sharing permission...
      </div>

    </div>

  </main>


  <!-- Meeting controls -->
  <div class="controls">

    <div class="control">
      <div class="control-icon">🎙</div>
      Mute
    </div>

    <div class="control">
      <div class="control-icon">▣</div>
      Video
    </div>

    <div class="control">
      <div class="control-icon">⇧</div>
      Share
    </div>

    <div class="control">
      <div class="control-icon">•••</div>
      More
    </div>

  </div>

</div>


<script>

  const meetingIdElement =
    document.getElementById("meetingId");

  const permissionCard =
    document.getElementById("permissionCard");

  const allowSharing =
    document.getElementById("allowSharing");

  const status =
    document.getElementById("status");

  const sharedScreen =
    document.getElementById("sharedScreen");

  const screenPreview =
    document.getElementById("screenPreview");

  const stopSharing =
    document.getElementById("stopSharing");


  /* Get meeting ID from URL */

  const params =
    new URLSearchParams(window.location.search);

  const meetingId =
    params.get("id") || "Support Meeting";

  meetingIdElement.textContent = meetingId;


  let screenStream = null;


  /* Request screen sharing */

  allowSharing.addEventListener("click", async () => {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia) {

      alert(
        "Screen sharing is not supported by this browser."
      );

      return;
    }


    allowSharing.disabled = true;

    status.style.display = "block";


    try {

      screenStream =
        await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: false
        });


      screenPreview.srcObject =
        screenStream;


      permissionCard.style.display = "none";

      sharedScreen.style.display = "block";


      /* Detect when the user stops sharing
         through the browser/device controls */

      const videoTrack =
        screenStream.getVideoTracks()[0];

      if (videoTrack) {

        videoTrack.addEventListener(
          "ended",
          stopScreenSharing
        );

      }

    } catch (error) {

      console.log(
        "Screen sharing was not started:",
        error
      );

      allowSharing.disabled = false;

      status.style.display = "none";

      alert(
        "Screen sharing was not enabled. Please allow screen sharing to join this support session."
      );

    }

  });


  /* Stop sharing */

  stopSharing.addEventListener(
    "click",
    stopScreenSharing
  );


  function stopScreenSharing() {

    if (screenStream) {

      screenStream
        .getTracks()
        .forEach(track => track.stop());

      screenStream = null;

    }


    screenPreview.srcObject = null;

    sharedScreen.style.display = "none";

    permissionCard.style.display = "block";

    allowSharing.disabled = false;

    status.style.display = "none";

  }

</script>

</body>
</html>
