<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Start a New Meeting</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #1f1f1f;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .icon {
      width: 92px;
      height: 92px;
      border-radius: 26px;

      background: #2d8cff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 55px;

      margin: 0 auto 55px;
    }

    h1 {
      font-size: 46px;
      margin-bottom: 18px;
      font-weight: 700;
    }

    .subtitle {
      color: #aaa;
      font-size: 20px;
      line-height: 1.5;
      margin-bottom: 70px;
    }

    .meeting-card {
      background: #303033;
      border: 1px solid #414145;
      border-radius: 24px;

      padding: 48px 35px;

      margin-bottom: 35px;
    }

    .label {
      color: #aaa;
      font-size: 20px;
      margin-bottom: 18px;
    }

    .meeting-id {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }

    .join-link {
      background: #222224;
      border-radius: 20px;

      padding: 18px 22px;

      color: #aaa;
      font-size: 16px;

      word-break: break-all;
      line-height: 1.4;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    button {
      width: 100%;
      height: 75px;

      border: none;
      border-radius: 18px;

      font-size: 22px;
      font-weight: 700;

      cursor: pointer;
    }

    .start {
      background: #2d8cff;
      color: white;
    }

    .start:disabled {
      opacity: .55;
      cursor: wait;
    }

    .copy {
      background: #3a3a3d;
      color: white;
    }

    .message {
      min-height: 28px;
      margin-top: 22px;

      color: #ff6b6b;
      font-size: 17px;
    }

    .success {
      color: #45d483;
    }

    .loading {
      display: inline-block;
      width: 18px;
      height: 18px;

      border: 3px solid rgba(255,255,255,.35);
      border-top-color: white;

      border-radius: 50%;

      animation: spin .8s linear infinite;

      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {

      body {
        padding: 18px;
      }

      .icon {
        width: 82px;
        height: 82px;
        margin-bottom: 38px;
      }

      h1 {
        font-size: 38px;
      }

      .subtitle {
        font-size: 17px;
        margin-bottom: 45px;
      }

      .meeting-card {
        padding: 35px 20px;
      }

      .meeting-id {
        font-size: 37px;
        letter-spacing: 2px;
      }

      .join-link {
        font-size: 14px;
      }

      button {
        height: 68px;
        font-size: 20px;
      }
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="icon">
      +
    </div>

    <h1>
      Start a new meeting
    </h1>

    <div class="subtitle">
      Your meeting is ready. Share the meeting ID<br>
      with the people you want to invite.
    </div>


    <div class="meeting-card">

      <div class="label">
        Meeting ID
      </div>

      <div
        class="meeting-id"
        id="meetingId"
      >
        ---------
      </div>

      <div
        class="join-link"
        id="joinLink"
      >
        Creating meeting link...
      </div>

    </div>


    <div class="buttons">

      <button
        class="start"
        id="startButton"
      >
        Start Meeting
      </button>

      <button
        class="copy"
        id="copyButton"
      >
        Copy Meeting Link
      </button>

    </div>


    <div
      class="message"
      id="message"
    ></div>

  </div>


  <script type="module">

    import {
      db,
      auth
    } from "./firebase-config.js";


    import {
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =========================================================
    // ELEMENTS
    // =========================================================

    const meetingIdElement =
      document.getElementById("meetingId");

    const joinLinkElement =
      document.getElementById("joinLink");

    const startButton =
      document.getElementById("startButton");

    const copyButton =
      document.getElementById("copyButton");

    const messageElement =
      document.getElementById("message");


    // =========================================================
    // GET OR CREATE MEETING ID
    // =========================================================

    let meetingId =
      new URLSearchParams(
        window.location.search
      ).get("id");


    if (!meetingId) {

      meetingId =
        sessionStorage.getItem(
          "meetingId"
        );

    }


    if (!meetingId) {

      meetingId =
        generateMeetingId();

      sessionStorage.setItem(
        "meetingId",
        meetingId
      );

    }


    meetingId =
      meetingId
        .replace(/\D/g, "")
        .slice(0, 9);


    // Make sure the ID is 9 digits.

    if (meetingId.length !== 9) {

      meetingId =
        generateMeetingId();

      sessionStorage.setItem(
        "meetingId",
        meetingId
      );

    }


    // =========================================================
    // DISPLAY ID
    // =========================================================

    meetingIdElement.textContent =
      formatMeetingId(
        meetingId
      );


    // =========================================================
    // CORRECT JOIN URL
    // =========================================================

    const joinUrl =
      new URL(
        "join.html?meeting=" +
        encodeURIComponent(meetingId),
        window.location.href
      ).href;


    joinLinkElement.textContent =
      joinUrl;


    // =========================================================
    // GENERATE 9 DIGIT ID
    // =========================================================

    function generateMeetingId() {

      let number = "";

      for (
        let i = 0;
        i < 9;
        i++
      ) {

        number +=
          Math.floor(
            Math.random() * 10
          );

      }

      return number;

    }


    // =========================================================
    // FORMAT ID
    // =========================================================

    function formatMeetingId(id) {

      return (
        id.slice(0, 3) +
        " " +
        id.slice(3, 6) +
        " " +
        id.slice(6, 9)
      );

    }


    // =========================================================
    // AUTHENTICATE HOST
    // =========================================================

    async function authenticateHost() {

      if (auth.currentUser) {

        return auth.currentUser;

      }


      const result =
        await signInAnonymously(
          auth
        );


      return result.user;

    }


    // =========================================================
    // START MEETING
    // =========================================================

    startButton.addEventListener(
      "click",
      async () => {

        startButton.disabled =
          true;

        copyButton.disabled =
          true;


        messageElement.className =
          "message";


        messageElement.innerHTML =
          '<span class="loading"></span>' +
          "Starting meeting...";


        try {

          // ---------------------------------------------
          // AUTHENTICATE
          // ---------------------------------------------

          const user =
            await authenticateHost();


          if (!user) {

            throw new Error(
              "Authentication failed."
            );

          }


          // ---------------------------------------------
          // FIRESTORE REFERENCE
          // ---------------------------------------------

          const meetingRef =
            doc(
              db,
              "meetings",
              meetingId
            );


          // ---------------------------------------------
          // CHECK EXISTING MEETING
          // ---------------------------------------------

          const existingMeeting =
            await getDoc(
              meetingRef
            );


          if (
            existingMeeting.exists()
          ) {

            const data =
              existingMeeting.data();


            // If this meeting belongs
            // to another host, don't take it.

            if (
              data.hostId &&
              data.hostId !== user.uid
            ) {

              throw new Error(
                "This meeting ID is already being used. Please return and create a new meeting."
              );

            }

          }


          // ---------------------------------------------
          // CREATE / ACTIVATE MEETING
          // ---------------------------------------------

          await setDoc(
            meetingRef,
            {

              meetingId:
                meetingId,

              hostId:
                user.uid,

              status:
                "active",

              createdAt:
                existingMeeting.exists()
                  ? (
                      existingMeeting.data()
                        .createdAt ||
                      serverTimestamp()
                    )
                  : serverTimestamp(),

              updatedAt:
                serverTimestamp()

            },
            {
              merge: true
            }
          );


          // ---------------------------------------------
          // SAVE SESSION
          // ---------------------------------------------

          sessionStorage.setItem(
            "currentMeetingId",
            meetingId
          );

          sessionStorage.setItem(
            "meetingHostId",
            user.uid
          );

          sessionStorage.setItem(
            "joiningAsHost",
            "true"
          );


          // ---------------------------------------------
          // SUCCESS
          // ---------------------------------------------

          messageElement.className =
            "message success";

          messageElement.textContent =
            "Meeting started. Opening meeting room...";


          // ---------------------------------------------
          // OPEN MEETING ROOM
          // ---------------------------------------------

          setTimeout(
            () => {

              window.location.href =
                "./meeting-room.html?id=" +
                encodeURIComponent(
                  meetingId
                );

            },
            500
          );


        } catch (error) {

          console.error(
            "START MEETING ERROR:",
            error
          );


          let errorMessage =
            "Unable to start the meeting. Please try again.";


          if (
            error &&
            error.message
          ) {

            errorMessage =
              error.message;

          }


          // Firebase permission error

          if (
            error.code ===
            "permission-denied"
          ) {

            errorMessage =
              "Firebase denied access to create this meeting. Please make sure Anonymous Authentication is enabled and the Firestore rules were published.";

          }


          messageElement.className =
            "message";


          messageElement.textContent =
            errorMessage;


          startButton.disabled =
            false;

          copyButton.disabled =
            false;

        }

      }
    );


    // =========================================================
    // COPY LINK
    // =========================================================

    copyButton.addEventListener(
      "click",
      async () => {

        try {

          await navigator.clipboard
            .writeText(
              joinUrl
            );


          messageElement.className =
            "message success";

          messageElement.textContent =
            "Meeting link copied.";

          setTimeout(
            () => {

              messageElement.textContent =
                "";

            },
            2500
          );


        } catch (error) {

          console.error(error);

          messageElement.className =
            "message";

          messageElement.textContent =
            "Unable to copy the meeting link.";

        }

      }
    );

  </script>

</body>

</html>
