<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sign In</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f7f8fa;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #222;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
      font-size: 32px;
      font-weight: 700;
      color: #2d8cff;
      letter-spacing: -1px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .password-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #d9d9d9;
      border-radius: 9px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2d8cff;
      box-shadow: 0 0 0 3px rgba(45, 140, 255, 0.1);
    }

    .password-wrapper input {
      padding-right: 52px;
    }

    .show-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      color: #666;
      font-size: 13px;
    }

    .forgot {
      text-align: right;
      margin-top: -6px;
      margin-bottom: 22px;
    }

    .forgot a {
      color: #2d8cff;
      text-decoration: none;
      font-size: 13px;
    }

    .signin-btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 9px;
      background: #2d8cff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .signin-btn:hover {
      background: #1677e8;
    }

    .signin-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #c62828;
    }

    .message.success {
      display: block;
      background: #effaf1;
      color: #218838;
    }

    .signup {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #777;
    }

    .signup a {
      color: #2d8cff;
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }

    .terms {
      text-align: center;
      color: #999;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Zoom
    </div>

    <div class="card">

      <h1>Sign in</h1>

      <p class="subtitle">
        Sign in to continue to your account
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="field">
          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
            >
              Show
            </button>

          </div>

        </div>

        <div class="forgot">
          <a href="forgot-password.html">
            Forgot password?
          </a>
        </div>

        <button
          type="submit"
          class="signin-btn"
          id="signinBtn"
        >
          Sign In
        </button>

      </form>

      <div class="signup">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
      </div>

      <div class="terms">
        By continuing, you agree to the terms and conditions
        of this service.
      </div>

    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* ==========================================
       FIREBASE CONFIG
    ========================================== */

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain:
        "YOUR_PROJECT_ID.firebaseapp.com",

      projectId:
        "YOUR_PROJECT_ID",

      storageBucket:
        "YOUR_PROJECT_ID.firebasestorage.app",

      messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

      appId:
        "YOUR_APP_ID"

    };


    /* ==========================================
       INITIALIZE FIREBASE
    ========================================== */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    /* ==========================================
       ELEMENTS
    ========================================== */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const signinBtn =
      document.getElementById("signinBtn");

    const message =
      document.getElementById("message");

    const showPassword =
      document.getElementById("showPassword");


    /* ==========================================
       SHOW / HIDE PASSWORD
    ========================================== */

    showPassword.addEventListener(
      "click",
      () => {

        if (
          passwordInput.type === "password"
        ) {

          passwordInput.type = "text";

          showPassword.textContent = "Hide";

        } else {

          passwordInput.type = "password";

          showPassword.textContent = "Show";

        }

      }
    );


    /* ==========================================
       MESSAGE
    ========================================== */

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    /* ==========================================
       LOGIN
    ========================================== */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Please enter your email and password."
          );

          return;

        }


        signinBtn.disabled = true;

        signinBtn.textContent =
          "Signing in...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          showMessage(
            "Signed in successfully.",
            "success"
          );


          /*
             Change this to the actual
             page you want users to see
             after signing in.
          */

          setTimeout(() => {

            window.location.href =
              "host.html";

          }, 500);


        } catch (error) {

          console.error(error);

          let errorMessage =
            "Unable to sign in.";

          switch (error.code) {

            case "auth/invalid-email":

              errorMessage =
                "Please enter a valid email address.";

              break;

            case "auth/invalid-credential":

            case "auth/wrong-password":

            case "auth/user-not-found":

              errorMessage =
                "Incorrect email or password.";

              break;

            case "auth/too-many-requests":

              errorMessage =
                "Too many attempts. Please try again later.";

              break;

            default:

              errorMessage =
                error.message;

          }

          showMessage(errorMessage);

          signinBtn.disabled = false;

          signinBtn.textContent =
            "Sign In";

        }

      }
    );


    /* ==========================================
       CHECK EXISTING LOGIN
    ========================================== */

    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          /*
             If the user is already signed in,
             send them directly to the host page.
          */

          // Uncomment when host.html is ready:
          // window.location.href = "host.html";

        }

      }
    );

  </script>

</body>
</html>
