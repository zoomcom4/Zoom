<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 22px;
    }

    header p {
      margin-top: 4px;
      color: #6b7280;
      font-size: 14px;
    }

    .dashboard {
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px, 1fr)
        );

      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #e5e7eb;
    }

    .stat-card span {
      display: block;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 28px;
    }

    .participants {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
    }

    .participants-header {
      padding: 18px 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .participants-header h2 {
      font-size: 18px;
    }

    #participantList {
      padding: 10px;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: #6b7280;
    }

    .participant-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .participant-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .participant-name {
      font-weight: 600;
      font-size: 16px;
    }

    .online {
      color: #16a34a;
      font-size: 13px;
      font-weight: 600;
    }

    .participant-info {
      margin-top: 10px;
      display: grid;
      gap: 5px;
      color: #6b7280;
      font-size: 13px;
    }

  </style>

</head>


<body>


<header>

  <h1>
    Live Participants
  </h1>

  <p>
    Monitor active meeting participants
  </p>

</header>


<main class="dashboard">


  <section class="stats">


    <div class="stat-card">

      <span>
        Online Now
      </span>

      <strong id="onlineCount">
        0
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Hosts
      </span>

      <strong id="hostCount">
        0
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Guests
      </span>

      <strong id="guestCount">
        0
      </strong>

    </div>


  </section>


  <section class="participants">

    <div class="participants-header">

      <h2>
        Active Participants
      </h2>

    </div>


    <div id="participantList">

      <div class="empty">
        Loading partcipants...
      </div>

    </div>

  </section>


</main>

<script type="module">

  import {
  auth,
  db
} from "./firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  import {
  collection,
  onSnapshot,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  console.log(
    "Admin Firebase connected:",
    db
  );
  
  const meetingsRef =
  collection(
    db,
    "meetings"
  );

onSnapshot(
  meetingsRef,
  snapshot => {

    console.log(
      "Meetings found:",
      snapshot.size
    );

    snapshot.forEach(
  meetingDoc => {

    console.log(
      "Meeting:",
      meetingDoc.id
    );

    const participantsRef =
      collection(
        db,
        "meetings",
        meetingDoc.id,
        "participants"
      );

    participantSnapshot => {

  const participants = [];

  participantSnapshot.forEach(
    participantDoc => {

      const data =
        participantDoc.data();

      participants.push({

        ...data,

        meetingId:
          meetingDoc.id

      });

    }
  );

  displayParticipants(
    participants
  );

},

      error => {

        console.error(
          "Participant error:",
          error
        );

      }
    );

  }
);

  error => {

    console.error(
      "Admin meetings error:",
      error
    );

  }
);

  error => {

    console.error(
      "Admin meetings error:",
      error
    );

  }
);

function displayParticipants(
  participants
) {

  const list =
    document.getElementById(
      "participantList"
    );

  list.innerHTML = "";

  if (
    participants.length === 0
  ) {

    list.innerHTML = `
      <div class="empty">
        No participants currently online.
      </div>
    `;

    return;
  }


  participants.forEach(
    participant => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "participant-card";

      card.innerHTML = `
        <div class="participant-top">

          <div class="participant-name">
            ${participant.uid}
          </div>

          <div class="online">
            ● Online
          </div>

        </div>

        <div class="participant-info">

          <div>
            Role: ${participant.role || "Unknown"}
          </div>

          <div>
            Meeting: ${participant.meetingId}
          </div>

        </div>
      `;

      list.appendChild(card);

    }
  );

}


</script>
</body>

</html>
